<h1 matDialogTitle>{{ data.title }}</h1>
<form [formGroup]="itemForm" (ngSubmit)="submit()">
  <div fxLayout="row wrap" fxLayout.lt-sm="column">
    <div fxFlex="50" class="pr-1" hidden>
      <mat-form-field class="full-width">
        <input
          matInput
          name="id"
          [formControl]="itemForm.controls['id']"
          placeholder="Id de la Marca"
        />
      </mat-form-field>
    </div>

    <div fxFlex="50" class="pr-1">
      <mat-form-field class="full-width">
        <input
          matInput
          name="descripcion"
          [formControl]="itemForm.controls['descripcion']"
          placeholder="Descripción de la Marca de Acoplado"
          autocomplete="off"
          #descripcion
          maxlength="10"
        />
        <mat-hint align="end">{{ descripcion.value.length }} / 10</mat-hint>
      </mat-form-field>
      <small
        *ngIf="itemForm.controls['descripcion'].hasError('maxlength')"
        class="form-error-msg"
      >
        La marca no puede contener mas de
        {{
          itemForm.controls["descripcion"].errors.maxlength.requiredLength
        }}
        caracteres
      </small>
    </div>

    <div fxFlex="100" class="mt-1">
      <button
        mat-button
        color="warn"
        type="button"
        (click)="dialogRef.close(false)"
      >
        Cancelar
      </button>
      <span fxFlex></span>
      <button mat-raised-button color="primary" [disabled]="itemForm.invalid">
        Guardar
      </button>
    </div>
  </div>
</form>
