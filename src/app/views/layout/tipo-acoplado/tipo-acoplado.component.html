<br>
<div class="m-333">
    <h4 style="color:#124A99;">Tipos de Acoplados</h4>
</div>
<div class="m-333">
  <!-- <span fxFlex></span> -->
  <button mat-raised-button class="mb-05" color="primary" (click)="openPopUp({}, true)">Agregar Tipo de Acoplado</button>
</div>
<mat-card class="p-0">
  <mat-card-content class="p-0">
    <ngx-datatable
          class="material ml-0 mr-0"
          [rows]="tipoAcoplados"
          [columnMode]="'flex'"
          [headerHeight]="50"
          [footerHeight]="50"
          [externalPaging]="true" 
          [count]="page.totalElements" 
          [offset]="page.pageNumber"
          [limit]="page.size" 
          (page)='setPage($event)' 
          [rowHeight]="'auto'">
          <!-- <ngx-datatable-column name="No." [flexGrow]="1">
              <ng-template let-row="row" ngx-datatable-cell-template>
                {{ row?.id }}
              </ng-template>
           </ngx-datatable-column> -->
           <ngx-datatable-column name="Descripción" [flexGrow]="1">
            <ng-template let-row="row" ngx-datatable-cell-template>
              {{ row?.descripcion }}
            </ng-template>
          </ngx-datatable-column>  
          <ngx-datatable-column name="Acciones" [flexGrow]="1">
            <ng-template let-row="row" ngx-datatable-cell-template>
              <button mat-icon-button mat-sm-button color="primary" class="mr-1" (click)="openPopUp(row)"><mat-icon>edit</mat-icon></button>
              <button mat-icon-button mat-sm-button color="warn" (click)="deleteItem(row)"><mat-icon>delete</mat-icon></button>
            </ng-template>
          </ngx-datatable-column>
        </ngx-datatable>
  </mat-card-content>
</mat-card>
