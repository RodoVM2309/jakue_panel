<!-- dialog-box.component.html -->
<div class="main-content" [ngStyle]="{'height':isDelete ? '30vh' : '38vh'}">
  <div class="container-fluid">
      <div class="row">
          <div class="col-md-12">
              <div class="card">
                  <div class="card-header card-header-success" [ngClass]="{'card-header-danger':isDelete  }">
                      <h4 class="card-title "> <strong>{{traduccionAction}} Autoridad de Salud</strong></h4>
                  </div>
                  <form [formGroup]="autoridadForm">
                      <div class="card-body">
                          <div *ngIf="action != 'Delete'; else elseTemplate">
                                  <mat-form-field class="full-width" appearance="outline">
                                      <mat-label>Nombre</mat-label>
                                      <input matInput placeholder="escriba el nombre de la autoridad.." formControlName="descripcion"
                                          type="text">
                                      <mat-icon matSuffix>mode_edit</mat-icon>
                                      <div *ngIf="f.descripcion.errors" class="form-error-msg">
                                          <div *ngIf="f.descripcion.errors.required">Debe ingresar nombre </div>
                                      </div>
                                  </mat-form-field>
                          </div>
                          <ng-template #elseTemplate>
                              ¿Está usted seguro de eliminar la autoridad de salud: <b>{{local_data.descripcion}}</b>?
                          </ng-template>

                          <div class="separator"></div>
                          <div mat-dialog-actions>
                            <button mat-button (click)="closeDialog()" mat-flat-button
                                  color="warn">Cancelar</button>
                                  <span fxFlex></span>
                              <button mat-raised-button color="primary" *ngIf="!isDelete" (click)="doAction()"
                                  [disabled]="autoridadForm.invalid"
                                  type="button" >{{traduccionAction}}</button>
                              <button mat-raised-button color="primary" *ngIf="isDelete" (click)="doAction()"
                                  type="button">{{traduccionAction}}</button>
                          </div>
                      </div>
                  </form>
              </div>
          </div>
      </div>
  </div>
</div>
