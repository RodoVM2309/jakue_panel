<div class="page-wrap height-100 mat-bg-primary"
  style="background-image: url('assets/images/muvin/back_login_muvin_01.jpg') !important;" >
  <div class="session-form-hold">
    <!-->mat-progress-bar mode="determinate" class="session-progress"></mat-progress-bar-->
    <mat-card>
      <mat-card-content>
        <div class="text-center pb-1">
          <img src="assets/images/muvin/jakue_logo-final-02.png" alt="" class="mb-05">
          <p class="text-muted m-0">Ingrese a su cuenta</p>
        </div>
        <!-- <h5>Accediendo a su cuenta al sistema</h5> -->
        <form [formGroup]="signinForm" (ngSubmit)="signin()" *ngIf="!activated">
          <div class="">
            <mat-form-field class="full-width">
              <input matInput name="username" maxlength="32" [formControl]="signinForm.controls['username']"
                placeholder="Usuario" (keyup)="hideError()">
            </mat-form-field>
            <small
              *ngIf="signinForm.controls['username'].hasError('required') && signinForm.controls['username'].touched"
              class="form-error-msg"> Debe ingresar el nombre de usuario</small>
          </div>

          <div class="">
            <mat-form-field class="full-width">
              <input matInput type="password" name="password" [formControl]="signinForm.controls['password']"
                placeholder="Contraseña" (keyup)="hideError()">
            </mat-form-field>
            <small
              *ngIf="signinForm.controls['password'].hasError('required') && signinForm.controls['password'].touched"
              class="form-error-msg">Debe ingresar una contraseña </small>
          </div>

          <div class="center-captcha">
            <!-- <re-captcha formControlName="captcha"></re-captcha> -->
            <!-- <button *ngIf="valError" (click)="signinForm.controls['captcha'].setValue('') ">Recargar Captcha</button> -->
            <small *ngIf="signinForm.controls['captcha'].hasError('required') && signinForm.controls['captcha'].touched"
              class="form-error-msg">Marque la casilla de verificación</small>
          </div>

          <div style="color:#fff;background:#ff4949;" *ngIf="valError">
            {{errorShow}}
          </div>

          <button mat-raised-button class="mat-primary full-width mb-1" [disabled]="signinForm.invalid">Entrar</button>
          <!-- <div class="text-center">
            <a [routerLink]="'/sessions/forgot-password'" class="mat-primary text-center full-width">Forgot password</a>
            <span fxFlex></span>
            <a [routerLink]="'/sessions/signup'" class="mat-primary text-center full-width">Create a new account</a>
          </div> -->
        </form>
        <div class="" *ngIf="activated">
          <form [formGroup]="signinRolForm" (ngSubmit)="signinRol()" *ngIf="activated">
            <!-- <h3>Seleccione el rol</h3> -->
            <div class="selected-rol">
              <mat-form-field ng-show="activated">
                <mat-select placeholder="{{labelRolSelected}}" [(ngModel)]="selectedRol" name="rol" (selectionChange)="chanceLabel()"
                  [formControl]="signinRolForm.controls['rol']">
                  <mat-option *ngFor="let rol of roles" [value]="rol.id">
                    {{rol.name}}
                  </mat-option>
                </mat-select>
              </mat-form-field>
              <!--  <p> Rol Seleccionado: {{selectedRol}} </p> -->
            </div>
            <button mat-raised-button class="mat-primary full-width mb-1" [disabled]="signinRolForm.invalid"
              ng-show="activated">Confirmar</button>
          </form>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>
