<mat-tab-group [selectedIndex]="selectedTab" (selectedIndexChange)="selectTab($event)" style="margin-top: 3px;">
  <mat-tab label="Cabeceras">
    <app-cabecera *ngIf="selectedTab === 0"></app-cabecera>
  </mat-tab>
  <mat-tab>
    <ng-template mat-tab-label style="text-align: center;">
      {{labelInconsistentes}} &nbsp;&nbsp; &nbsp;
      <button mat-mini-fab *ngIf="pageInconsistencia.totalElements>0" class="my-fab">
        {{pageInconsistencia.totalElements}}
      </button>
    </ng-template>
    <app-inconsistencia [data]="lista_inconsistencias" [page]="pageInconsistencia" (cambiarPage)="chancePage($event)" *ngIf="selectedTab === 1"></app-inconsistencia>
  </mat-tab>
  <mat-tab label="Auditoría">
    <app-auditoria [data]="lista_auditoria" [inputCupo]="filtroBuscar" [page]="pageAuditoria"  (cambiarPage)="chancePageAuditoria($event)" (buscarCupo)="buscarCupos($event)"  *ngIf="selectedTab === 2"></app-auditoria>
  </mat-tab>
  <mat-tab label="Consultas CCPP">
    <app-consulta *ngIf="selectedTab === 3"></app-consulta>
  </mat-tab>
</mat-tab-group>
