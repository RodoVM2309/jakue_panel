<br>
<div class="m-333">
    <h4 style="color:#124A99;">Choferes Perdidos</h4>
</div>
<mat-card class="p-0">  
  <mat-card-content class="p-0">
    <mat-form-field  class="p-5"  style='padding:8px;margin:15px auto;width:30%;'  class = "example-full-width"> 
      <mat-label> <mat-icon matPrefix>search</mat-icon> Buscar por tipo acoplado</mat-label>
      <input  matInput (keyup)='updateFilter($event)'> 
    </mat-form-field>
    <ngx-datatable class="material ml-0 mr-0" [rows]="choferes" [columnMode]="'force'" [headerHeight]="50"
      [footerHeight]="50" [externalPaging]="true" [count]="page.totalElements" [offset]="page.pageNumber" [limit]="page.size"
      (page)='setPage($event)' [rowHeight]="'auto'">
      <!-- <ngx-datatable-column name="No." [flexGrow]="1">
            <ng-template let-row="row" ngx-datatable-cell-template>
              {{ row?.id }}
            </ng-template>
          </ngx-datatable-column> -->
      <ngx-datatable-column name="Nombre" [flexGrow]="1">
        <ng-template let-row="row" ngx-datatable-cell-template>
          {{ row?.nombre }}
        </ng-template>
      </ngx-datatable-column>
      <ngx-datatable-column name="Apellidos" [flexGrow]="1">
        <ng-template let-row="row" ngx-datatable-cell-template>
          {{ row?.apellidos }}
        </ng-template>
      </ngx-datatable-column>
      <ngx-datatable-column name="Email" [flexGrow]="1">
        <ng-template let-row="row" ngx-datatable-cell-template>
          {{ row?.email }}
        </ng-template>
      </ngx-datatable-column>
      <ngx-datatable-column name="Telefono" [flexGrow]="1">
        <ng-template let-row="row" ngx-datatable-cell-template>
          {{ row?.telefono }}
        </ng-template>
      </ngx-datatable-column>
      <ngx-datatable-column name="Fecha" [flexGrow]="1">
        <ng-template let-row="row" ngx-datatable-cell-template>
          {{ row?.fecha }}
        </ng-template>
      </ngx-datatable-column>
      <ngx-datatable-column name="Acoplado" [flexGrow]="1">
        <ng-template let-row="row" ngx-datatable-cell-template>
          {{ row?.tipo_acoplado }}
        </ng-template>
      </ngx-datatable-column>
      
    </ngx-datatable>
  </mat-card-content>
</mat-card>
