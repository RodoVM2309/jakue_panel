<br />
<div class="m-333">
  <h4 style="color:#124A99;">{{ "usuario-whatsapp.nav" | translate }}</h4>
</div>
<mat-card class="p-0">
  <mat-card-content class="p-0" style="height: 90vh">
    <br />
    <button mat-raised-button class="mb-05" style="margin-top: -9px;
    margin-left: 26px;" color="primary" (click)="openPopUpUsuarioWhatsapp()">
      {{ "usuario-whatsapp.add" | translate }}
    </button>
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
      <!-- chofer Column -->
      <ng-container matColumnDef="razon_social">
        <th mat-header-cell *matHeaderCellDef> {{ "usuario-whatsapp.razon_social" | translate }} </th>
        <td mat-cell *matCellDef="let row">{{row?.razon_social}} </td>
        <td mat-footer-cell *matFooterCellDef> </td>
      </ng-container>
      <!-- patente Column -->
      <ng-container matColumnDef="cuit_cliente">
        <th mat-header-cell *matHeaderCellDef> {{ "usuario-whatsapp.cuit" | translate }} </th>
        <td mat-cell *matCellDef="let row"> {{row?.cuit_cliente}} </td>
        <td mat-footer-cell *matFooterCellDef> </td>
      </ng-container>
      <!-- patente Column -->
      <ng-container matColumnDef="telefono">
        <th mat-header-cell *matHeaderCellDef> {{ "usuario-whatsapp.telefono" | translate }} </th>
        <td mat-cell *matCellDef="let row"> {{row?.telefono}} </td>
        <td mat-footer-cell *matFooterCellDef> </td>
      </ng-container>



      <!-- Acciones Column -->
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef> {{ "options.actions" | translate }} </th>
        <td mat-cell *matCellDef="let row">
          <button mat-raised-button color="warn"
            matTooltip='{{ "usuario-whatsapp.deleteCliente" | translate }}' style="border-radius: 10px" (click)="deleteItem(row)">
            <mat-icon>delete</mat-icon>&nbsp;&nbsp; {{ "usuario-whatsapp.deleteCliente" | translate }}
          </button>
        </td>
        <td mat-footer-cell *matFooterCellDef> </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="example-element-row"
        [ngStyle]="(row.disponibilidad=='1' || row?.estado === 'Ocupado') && {'background-color': '#efefef'}">
      </tr>
      <tr mat-footer-row *matFooterRowDef="displayedColumns"></tr>
    </table>
    <mat-paginator #paginator class="mat-paginator-sticky" [pageSize]="page.size" [pageSizeOptions]="[5]"
      [showFirstLastButtons]="true" [length]="page.totalElements" (page)="setPage($event)">
    </mat-paginator>
  </mat-card-content>
</mat-card>
