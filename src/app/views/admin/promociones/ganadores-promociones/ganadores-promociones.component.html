<mat-card class="p-0">
  <mat-card-content class="p-0">
    <div class="m-333">
      <h4 style="color:#124A99;">Ganadores Promoción</h4>
    </div>
    <ngx-datatable class="material ml-0 mr-0" [rows]="ganadores" [columnMode]="'force'" [headerHeight]="50"
      [footerHeight]="50" [externalPaging]="false" [rowHeight]="'auto'">
      <!-- <ngx-datatable-column name="No." [flexGrow]="1" >
              <ng-template let-row="row" ngx-datatable-cell-template>
                {{ row?.id }}
              </ng-template>
           </ngx-datatable-column> -->
      <ngx-datatable-column name="Nombre" [flexGrow]="1">
        <ng-template let-row="row" ngx-datatable-cell-template>
          {{ row?.nombre }}
        </ng-template>
      </ngx-datatable-column>
      <ngx-datatable-column name="Apellidos" [flexGrow]="1">
        <ng-template let-row="row" ngx-datatable-cell-template>
          {{ row?.apellidos }}
        </ng-template>
      </ngx-datatable-column>
      <ngx-datatable-column name="Email" [flexGrow]="1">
        <ng-template let-row="row" ngx-datatable-cell-template>
          {{ row?.email }}
        </ng-template>
      </ngx-datatable-column>
      <ngx-datatable-column name="Teléfono" [flexGrow]="1">
        <ng-template let-row="row" ngx-datatable-cell-template>
          {{ row?.telefono }}
        </ng-template>
      </ngx-datatable-column>
      <ngx-datatable-column name="Cupón" [flexGrow]="1">
        <ng-template let-row="row" ngx-datatable-cell-template>
          {{ row?.cupon }}
        </ng-template>
      </ngx-datatable-column>

    </ngx-datatable>
    
  </mat-card-content>
</mat-card>
<mat-card class="p-0">
    <mat-card-content class="p-0">
      <div fxFlex="100" class="mt-1">
      <button mat-raised-button color="warn" type="button" (click)="dialogRef.close(false)">Cancelar</button>
    </div>
  </mat-card-content>
</mat-card>
