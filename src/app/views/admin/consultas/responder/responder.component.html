<h1 matDialogTitle>{{data.title}}</h1>
<form [formGroup]="itemForm" (ngSubmit)="submit()">
  <div fxLayout="row wrap" fxLayout.lt-sm="column">
    <div fxFlex="50" class="pr-1" hidden>
      <mat-form-field class="full-width">
        <input matInput name="id_consulta" [formControl]="itemForm.controls['id_consulta']" placeholder="Id">
      </mat-form-field>
    </div> 
    <div fxFlex="50" class="pr-1" hidden>
      <mat-form-field class="full-width">
        <input matInput name="id_muvin" [formControl]="itemForm.controls['id_muvin']" placeholder="Id">
      </mat-form-field>
    </div> 
    
    <div fxFlex="100" class="pr-1">
      <mat-form-field class="full-width">
        <textarea matInput  name="mensaje" [formControl]="itemForm.controls['mensaje']" placeholder="Mensaje"></textarea>
      </mat-form-field>
      <small *ngIf="itemForm.controls['mensaje'].hasError('required') && itemForm.controls['mensaje'].touched"
        class="form-error-msg"> Es requerido el mensaje
      </small>
    </div>
      
    <div fxFlex="100" class="mt-1">
      <button mat-raised-button color="warn" type="button" (click)="dialogRef.close(false)">Cancelar</button>
      <span fxFlex></span>
      <button mat-raised-button color="primary" [disabled]="itemForm.invalid">Enviar</button>
    </div>
  </div>
</form>
