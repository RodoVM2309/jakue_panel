<h1 matDialogTitle>{{ data.title }}</h1>
<form [formGroup]="itemForm" (ngSubmit)="submit()">
  <div fxLayout="row wrap" fxLayout.lt-sm="column">
    <div fxFlex="50" class="pr-1" hidden>
      <mat-form-field class="full-width">
        <input
          matInput
          name="id"
          [formControl]="itemForm.controls['id']"
          placeholder="Id del producto"
        />
      </mat-form-field>
    </div>
    <div fxFlex="50" class="pr-1">
      <mat-form-field class="full-width">
        <input
          matInput
          name="descripcion"
          [formControl]="itemForm.controls['descripcion']"
          placeholder="Descripción"
          #descripcion
          maxlength="50"
        />
        <mat-hint align="end">{{ descripcion.value.length }} / 50</mat-hint>
      </mat-form-field>
      <small
        *ngIf="
          itemForm.controls['descripcion'].hasError('required') &&
          itemForm.controls['descripcion'].touched
        "
        class="form-error-msg"
      >
        La Descripción es obligatoria
      </small>
    </div>

    <div fxFlex="50" class="pr-1">
      <mat-form-field class="full-width">
        <mat-select formControlName="id_tipo_producto" id="id_tipo_producto" placeholder="Tipo de Producto">
          <mat-option *ngFor="let tipo of tipoProductos" [value]="tipo.id" ngDefaultControl>
          {{ tipo.descripcion }}
          </mat-option>
        </mat-select>
        </mat-form-field>
      <small
        *ngIf="
          itemForm.controls['id_tipo_producto'].hasError('required') &&
          itemForm.controls['id_tipo_producto'].touched
        "
        class="form-error-msg"
      >
        El tipo de producto es obligatorio
      </small>
      

    </div>

    <!--Contenedor de botones-->
    <div fxFlex="100" class="mt-1">
      <button
        mat-raised-button
        color="warn"
        type="button"
        (click)="dialogRef.close(false)"
      >
        Cancelar
      </button>
      <span fxFlex></span>
      <button mat-raised-button color="primary" [disabled]="itemForm.invalid">
        Guardar
      </button>
    </div>
  </div>
</form>
