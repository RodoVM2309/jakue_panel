<h1 matDialogTitle>{{ data.title }}</h1>
<form [formGroup]="itemForm" (ngSubmit)="submit()">
  <div fxLayout="row wrap" fxLayout.lt-sm="column">
    <div fxFlex="50" class="pr-1" hidden>
      <mat-form-field class="full-width">
        <input
          matInput
          name="id_chofer"
          [formControl]="itemForm.controls['id_chofer']"
          placeholder="Id del Chofer"
        />
      </mat-form-field>
    </div>
    <div fxFlex="50" class="pr-1" hidden>
      <mat-form-field class="full-width">
        <input
          matInput
          name="id"
          [formControl]="itemForm.controls['id']"
          placeholder="Id del Chofer"
        />
      </mat-form-field>
    </div>
    <div fxFlex="50" class="pr-1">
      <mat-form-field class="full-width">
        <mat-select
          placeholder="Motivo"
          [formControl]="itemForm.controls['id_motivo']"
          name="id_motivo"
          class="mb-1"
        >
          <mat-option
            *ngFor="let motivo of motivos"
            [value]="motivo.id"
            ngDefaultControl
          >
            {{ motivo.descripcion }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <div fxFlex="100" class="pr-1">
      <mat-form-field class="full-width">
        <input
          matInput
          name="explicacion"
          [formControl]="itemForm.controls['explicacion']"
          placeholder="Descripción de la causa por lo que se lo añade a lista negra"
          #explicacion
          maxlength="600"
        />
        <mat-hint align="end">{{ explicacion.value.length }} / 600</mat-hint>
      </mat-form-field>
    </div>

    <div fxFlex="50" class="pr-1">
      <mat-form-field class="full-width">
        <input
          matInput
          [matDatepicker]="fechaPicker"
          [min]="minDate"
          [formControl]="itemForm.controls['fecha_hasta']"
          placeholder="Fecha hasta (opcional)"
          name="fecha_hasta"
        />
        <mat-datepicker-toggle matSuffix [for]="fechaPicker"></mat-datepicker-toggle>
        <mat-datepicker #fechaPicker></mat-datepicker>
        <mat-hint *ngIf="!fechaHastaErrors">Selecciona una fecha mayor a hoy</mat-hint>
        <mat-error *ngIf="fechaHastaErrors">{{ fechaHastaErrors }}</mat-error>
      </mat-form-field>
    </div>
    <div fxFlex="100" class="mt-1">
      <button
        mat-raised-button
        color="warn"
        type="button"
        (click)="dialogRef.close(false)"
      >
        Cancelar
      </button>
      <span fxFlex></span>
      <button mat-raised-button color="primary" [disabled]="itemForm.invalid">
        Guardar
      </button>
    </div>
  </div>
</form>
