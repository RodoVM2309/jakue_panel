<mat-card class="p-0">
  <mat-card-content class="p-0">
    <mat-form-field  class="p-5"  style='padding:8px;margin:15px auto;width:30%;'  class = "example-full-width"> 
      <mat-label> <mat-icon matPrefix>search</mat-icon> Buscar Rol</mat-label>
      <input  matInput (keyup)='updateFilter($event)'> 
    </mat-form-field>
    <ngx-datatable
          class="material ml-0 mr-0"
          [rows]="destinos"
          [columnMode]="'force'"
          [headerHeight]="50"
          [footerHeight]="50"
          [limit]="10"
          [rowHeight]="'auto'">
          <!-- <ngx-datatable-column name="No." [flexGrow]="1">
              <ng-template let-row="row" ngx-datatable-cell-template>
                {{ row?.id }}
              </ng-template>
           </ngx-datatable-column> -->
          <ngx-datatable-column name="Descripcion" [flexGrow]="1">
            <ng-template let-row="row" ngx-datatable-cell-template>
              {{ row?.descripcion }}
            </ng-template>
          </ngx-datatable-column>
          <ngx-datatable-column name="Zona" [flexGrow]="1">
            <ng-template let-row="row" ngx-datatable-cell-template>
              {{ row?.nombre_zona_destino }}
            </ng-template>
          </ngx-datatable-column>
          <ngx-datatable-column name="Localidad" [flexGrow]="1">
            <ng-template let-row="row" ngx-datatable-cell-template>
              {{ row?.nombre_localidad }}
            </ng-template>
          </ngx-datatable-column>
          <ngx-datatable-column name="Tipo" [flexGrow]="1">
            <ng-template let-row="row" ngx-datatable-cell-template>
              {{ row?.nombre_tipo_destino }}
            </ng-template>
          </ngx-datatable-column>
          <ngx-datatable-column name="Bloqueado" [flexGrow]="1">
            <ng-template let-row="row" ngx-datatable-cell-template>
              {{ row?.desc_bloqueado }}
            </ng-template>
          </ngx-datatable-column>
          <ngx-datatable-column name="Acciones" [flexGrow]="1">
            <ng-template let-row="row" ngx-datatable-cell-template>
              <button mat-icon-button mat-sm-button color="primary" class="mr-1" matTooltip="Actualizar" (click)="openPopUp(row)"><mat-icon>edit</mat-icon></button>
            </ng-template>
          </ngx-datatable-column>
        </ngx-datatable>
  </mat-card-content>
</mat-card>
