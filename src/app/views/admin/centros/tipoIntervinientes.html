<h1 mat-dialog-title>Tipo de Interviniente:</h1>
<div mat-dialog-content>
    <mat-form-field>
        <mat-select placeholder="Intervinientes" [(value)]="selected">
            <mat-option *ngFor="let interviniente of intervinientes" [value]="interviniente.value">
                 {{interviniente.viewValue}}
            </mat-option>
        </mat-select>
    </mat-form-field>
</div>
<div mat-dialog-actions>
  <button mat-button (click)="onNoClick()">Cancelar</button>
  <button mat-button [mat-dialog-close]="selected" cdkFocusInitial>Guardar</button>
</div>
