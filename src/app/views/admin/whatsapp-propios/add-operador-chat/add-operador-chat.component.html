<h1 matDialogTitle>{{ data.title }}</h1>
<form [formGroup]="itemForm" (ngSubmit)="submit()">
  <div fxLayout="row wrap" fxLayout.lt-sm="column" [style.overflow]="'auto'">
    <div fxFlex="100" class="pr-1" hidden>
      <mat-form-field class="full-width">
        <input matInput name="id" [formControl]="itemForm.controls['id']" placeholder="Id del producto" />
      </mat-form-field>
    </div>
    <div fxFlex="50" class="pr-1">
      <mat-form-field class="full-width">
        <input matInput name="nombre"  maxlength="45" [formControl]="itemForm.controls['nombre']" placeholder="Nombre" />
      </mat-form-field>
      <small *ngIf="itemForm.controls['nombre'].hasError('required') && itemForm.controls['nombre'].touched" class="form-error-msg">
        Es requerido el nombre
      </small>
    </div>
    <div fxFlex="50" class="pr-1">
      <mat-form-field class="full-width">
        <input matInput name="apellidos"  maxlength="65" [formControl]="itemForm.controls['apellidos']" placeholder="Apellidos"/>
      </mat-form-field>
      <small *ngIf="itemForm.controls['apellidos'].hasError('required') && itemForm.controls['apellidos'].touched" class="form-error-msg">
        Es requerido los apellidos
      </small>
    </div>
    <div fxFlex="50" class="pr-1">
      <mat-form-field class="full-width">
        <input matInput name="telefono"  maxlength="45" [formControl]="itemForm.controls['telefono']" placeholder="Teléfono"/>
      </mat-form-field>
      <small *ngIf="itemForm.controls['telefono'].hasError('required') && itemForm.controls['telefono'].touched" class="form-error-msg">
        Es requerido el teléfono
      </small>
    </div>

    <div fxFlex="100" class="mt-1">
      <button mat-raised-button color="primary" [disabled]="itemForm.invalid">
        Guardar
      </button>
      <span fxFlex></span>
      <button mat-raised-button color="warn" type="button" (click)="dialogRef.close(false)">
        Cancelar
      </button>
    </div>
  </div>
</form>
