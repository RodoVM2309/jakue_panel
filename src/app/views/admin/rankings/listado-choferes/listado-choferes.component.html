<br>
<div class="m-333">
  <h4 style="color:#124A99;">{{data.title}}</h4>
  <div fxFlex fxHide.lt-sm="true" class="search-bar" id="buscador">
    <form class="top-search-form">
      <mat-icon role="img">search</mat-icon>
      <input autofocus="true" placeholder="Buscador" type="text">
    </form>
  </div>
  <span fxFlex></span>
  <button mat-button color="warn" type="button" (click)="dialogRef.close(false)">Cerrar</button>
</div>
<mat-card class="p-0">
  <mat-card-content class="p-0">
    <ngx-datatable class="material ml-0 mr-0" [rows]="choferes" [columnMode]="'force'" [headerHeight]="50"
      [footerHeight]="50" [externalPaging]="true" [count]="page.totalElements" [offset]="page.pageNumber"
      [limit]="page.size" (page)='setPage($event)' [rowHeight]="'auto'" [messages]="messages">
      <!--  <ngx-datatable-column name="No." [flexGrow]="1">
              <ng-template let-row="row" ngx-datatable-cell-template>
                {{ row?.id_chofer }}
              </ng-template>
           </ngx-datatable-column>  -->
      <ngx-datatable-column name="Apellido, Nombre" [flexGrow]="1">
        <ng-template let-row="row" ngx-datatable-cell-template>
          {{ row?.nombre_chofer }}
        </ng-template>
      </ngx-datatable-column>
      <ngx-datatable-column name="Camión" [flexGrow]="1">
        <ng-template let-row="row" ngx-datatable-cell-template>
          {{ row?.patente }}
        </ng-template>
      </ngx-datatable-column>
      <ngx-datatable-column name="Tipo camión" [flexGrow]="1">
        <ng-template let-row="row" ngx-datatable-cell-template>
          {{ row?.tipo_camion }}
        </ng-template>
      </ngx-datatable-column>
      <ngx-datatable-column name="Total viajes" [flexGrow]="1">
        <ng-template let-row="row" ngx-datatable-cell-template>
          {{ row?.total_viajes }}
        </ng-template>
      </ngx-datatable-column>
      <ngx-datatable-column name="Viajes completados" [flexGrow]="1">
        <ng-template let-row="row" ngx-datatable-cell-template>
          {{ row?.viajes_completados }}
        </ng-template>
      </ngx-datatable-column>
      <ngx-datatable-column name="Ranking" [flexGrow]="1">
        <ng-template let-row="row" ngx-datatable-cell-template>
          {{ row?.ranking }}
        </ng-template>
      </ngx-datatable-column>
      <ngx-datatable-column name="Acciones" [flexGrow]="3">
        <ng-template let-row="row" ngx-datatable-cell-template>
          <button mat-icon-button mat-sm-button color="primary" class="m-0" (click)="openPopUpInfoPersona(row)"
            matTooltip="Información">
            <mat-icon>account_circle</mat-icon>
          </button>
        </ng-template>
      </ngx-datatable-column>
    </ngx-datatable>
  </mat-card-content>
</mat-card>
