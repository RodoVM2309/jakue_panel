<br />
<div class="m-333">
  <h4 style="color:#124A99;">WhatsApp de Clientes</h4>
</div>
<div class="m-333">
  <!-- <span fxFlex></span> -->
  <button mat-raised-button class="mb-05" color="primary" (click)="openPopUp({}, true)">
    Agregar operador
  </button>
</div>
<mat-card class="p-0">
  <mat-card-content class="p-0">
    <mat-form-field class="p-5" style="padding:8px;margin:15px auto;width:30%;" class="example-full-width">
      <mat-label>
        <mat-icon matPrefix>search</mat-icon> Buscar operador
      </mat-label>
      <input matInput (keyup)="updateFilter($event)" />
    </mat-form-field>
    <ngx-datatable class="material ml-0 mr-0" [rows]="operadorChat" [columnMode]="'force'" [headerHeight]="50"
      [footerHeight]="50" [externalPaging]="true" [count]="page.totalElements" [offset]="page.pageNumber"
      [limit]="page.size" (page)="setPage($event)" [rowHeight]="'auto'">
      <!-- <ngx-datatable-column name="No." [flexGrow]="1" >
              <ng-template let-row="row" ngx-datatable-cell-template>
                {{ row?.id }}
              </ng-template>
           </ngx-datatable-column> -->
      <ngx-datatable-column name="Nombre" [flexGrow]="1">
        <ng-template let-row="row" ngx-datatable-cell-template>
          {{ row?.nombre }}
        </ng-template>
      </ngx-datatable-column>
      <ngx-datatable-column name="Apellidos" [flexGrow]="1">
        <ng-template let-row="row" ngx-datatable-cell-template>
          {{ row?.apellidos }}
        </ng-template>
      </ngx-datatable-column>
      <ngx-datatable-column name="Teléfono" [flexGrow]="1">
        <ng-template let-row="row" ngx-datatable-cell-template>
          {{ row?.telefono }}
        </ng-template>
      </ngx-datatable-column>
      <ngx-datatable-column name="Centro Representado" [flexGrow]="1">
        <ng-template let-row="row" ngx-datatable-cell-template>
          {{ row?.nombreCentro }}
        </ng-template>
      </ngx-datatable-column>

      <ngx-datatable-column name="Acciones" [flexGrow]="1">
        <ng-template let-row="row" ngx-datatable-cell-template>
          <button mat-icon-button mat-sm-button color="primary" class="mr-1" matTooltip="Editar"
            (click)="openPopUp(row)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button mat-sm-button color="warn" matTooltip="Eliminar" (click)="deleteItem(row)">
            <mat-icon>delete</mat-icon>
          </button>
        </ng-template>
      </ngx-datatable-column>
    </ngx-datatable>
  </mat-card-content>
</mat-card>
