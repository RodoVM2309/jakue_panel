<br>
<div class="m-333">
    <h4 style="color:#124A99;">Equipos</h4>
</div>
<div class="m-333">
  <!-- <span fxFlex></span> -->
  <button mat-raised-button class="mb-05" color="primary" (click)="openPopUp({}, true)">Agregar Equipo</button>
</div>
<mat-card class="p-0">
  <mat-card-content class="p-0">
    <ngx-datatable class="material ml-0 mr-0" 
        [rows]="equipos" 
        [columnMode]="'force'" 
        [headerHeight]="50" 
        [footerHeight]="50"
          [externalPaging]="true" 
          [count]="page.totalElements" 
          [offset]="page.pageNumber"
          [limit]="page.size" 
          (page)='setPage($event)'
        [rowHeight]="'auto'">
     <!--  <ngx-datatable-column name="No." [flexGrow]="1">
        <ng-template let-row="row" ngx-datatable-cell-template>
          {{ row?.id }}
        </ng-template>
      </ngx-datatable-column> -->
      <!--ngx-datatable-column name="Transportista" [flexGrow]="1">
        <ng-template let-row="row" ngx-datatable-cell-template>
          {{ row?.nombre_transportista }}
        </ng-template>
      </ngx-datatable-column-->
      <ngx-datatable-column name="Marca Camión" [flexGrow]="1">
        <ng-template let-row="row" ngx-datatable-cell-template>
          {{ row?.nombre_marca_camion }}
        </ng-template>
      </ngx-datatable-column>
      <ngx-datatable-column name="Tipo Camion" [flexGrow]="1">
        <ng-template let-row="row" ngx-datatable-cell-template>
          {{ row?.nombre_tipo_camion }}
        </ng-template>
      </ngx-datatable-column>
      <ngx-datatable-column name="Patente Camión" [flexGrow]="1">
        <ng-template let-row="row" ngx-datatable-cell-template>
          {{ row?.patente_camion }}
        </ng-template>
      </ngx-datatable-column>
      <ngx-datatable-column name="Marca Acoplado" [flexGrow]="1">
        <ng-template let-row="row" ngx-datatable-cell-template>
          {{ row?.nombre_marca_acoplado }}
        </ng-template>
      </ngx-datatable-column>
      <ngx-datatable-column name="Tipo Acoplado" [flexGrow]="1">
        <ng-template let-row="row" ngx-datatable-cell-template>
          {{ row?.nombre_tipo_acoplado }}
        </ng-template>
      </ngx-datatable-column>
      <ngx-datatable-column name="Patente Acoplado" [flexGrow]="1">
        <ng-template let-row="row" ngx-datatable-cell-template>
          {{ row?.patente_acoplado }}
        </ng-template>
      </ngx-datatable-column>

      <ngx-datatable-column name="Bloqueado" [flexGrow]="1">
        <ng-template let-row="row" ngx-datatable-cell-template>
          {{ row?.desc_bloqueado }}
        </ng-template>
      </ngx-datatable-column>
      <ngx-datatable-column name="Acciones" [flexGrow]="2">
        <ng-template let-row="row" ngx-datatable-cell-template>
          <button mat-icon-button mat-sm-button color="primary" class="mr-1" *ngIf="!row.bloqueado" matTooltip="Bloquear" (click)="bloquearEquipo(row)"><mat-icon>lock_open</mat-icon></button> 
          <button mat-icon-button mat-sm-button color="primary" class="mr-1" *ngIf="row.bloqueado" matTooltip="Desbloquear" (click)="desBloquearEquipo(row)"><mat-icon>lock_outline</mat-icon></button>
  <!--         <button mat-icon-button mat-sm-button color="primary" class="mr-1" (click)="openPopUp(row)">
            <mat-icon>edit</mat-icon>
          </button> -->
          <button mat-icon-button mat-sm-button color="warn" matTooltip="Eliminar" (click)="deleteItem(row)">
            <mat-icon>delete</mat-icon>
          </button>
          <!--button mat-menu-item *ngIf="row.bloqueado" (click)="desBloquearCamion(row)">
            <mat-icon>lock</mat-icon> </button>
          <button mat-menu-item *ngIf="!row.bloqueado" (click)="bloquearCamion(row)">
            <mat-icon>lock</mat-icon> </button-->
           
        </ng-template>
      </ngx-datatable-column>
    </ngx-datatable>
  </mat-card-content>
</mat-card>
