<br>
<div class="m-333">
  <!-- <span fxFlex></span> -->
  <button mat-raised-button class="mb-05" color="primary" (click)="openPopUp({}, true)">Agregar Localidad</button>
</div>
<mat-card class="p-0">
  <mat-card-content class="p-0">    
    <div class="pb-1">
        <input
        type='text'
        style='padding:8px;margin:15px auto;width:30%;'
        placeholder='Buscar Localidad'
        (keyup)='updateFilter($event)'
        class="mr-1"
      />
      <button mat-raised-button class="mr-1" color="accent" (click)="cerrar()">Volver al listado</button>         
    </div> 
    <ngx-datatable
          class="material ml-0 mr-0"
          [rows]="localidades"
          [columnMode]="'force'"
          [headerHeight]="50"
          [footerHeight]="50"
          [limit]="5"
          [rowHeight]="'auto'">
          <!-- <ngx-datatable-column name="No." [flexGrow]="1" >
              <ng-template let-row="row" ngx-datatable-cell-template>
                {{ row?.id }}
              </ng-template>
           </ngx-datatable-column> -->
          <ngx-datatable-column name="Descripción" [flexGrow]="1">
            <ng-template let-row="row" ngx-datatable-cell-template>
              {{ row?.descripcion }}
            </ng-template>
          </ngx-datatable-column>    
          <ngx-datatable-column name="Código postal" [flexGrow]="1">
            <ng-template let-row="row" ngx-datatable-cell-template>
              {{ row?.codigopostal }}
            </ng-template>
          </ngx-datatable-column>      
          <ngx-datatable-column name="Longitud" [flexGrow]="1">
            <ng-template let-row="row" ngx-datatable-cell-template>
              {{ row?.longitud }}
            </ng-template>
          </ngx-datatable-column>      
          <ngx-datatable-column name="Latitud" [flexGrow]="1">
            <ng-template let-row="row" ngx-datatable-cell-template>
              {{ row?.latitud }}
            </ng-template>
          </ngx-datatable-column>      
          <ngx-datatable-column name="Acciones" [flexGrow]="1">
            <ng-template let-row="row" ngx-datatable-cell-template>
              <button mat-icon-button mat-sm-button color="primary" class="mr-1" matTooltip="Actualizar" (click)="openPopUp(row)"><mat-icon>edit</mat-icon></button>
              <button mat-icon-button mat-sm-button color="warn" matTooltip="Eliminar" (click)="deleteItem(row)"><mat-icon>delete</mat-icon></button>
            </ng-template>
          </ngx-datatable-column>
        </ngx-datatable>         
  </mat-card-content>   
</mat-card>
