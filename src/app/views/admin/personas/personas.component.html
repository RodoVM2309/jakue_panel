<br>
<div class="m-333">
    <h4 style="color:#124A99;">Personas</h4>
</div>
<div class="m-333">
  <!-- <span fxFlex></span> -->
  <button mat-raised-button class="mb-05" color="primary" (click)="openPopUp({}, true)">Agregar Persona</button>
</div>
<mat-card class="p-0">
  <mat-card-content class="p-0">
    
     <mat-form-field  class="p-5"  style='padding:8px;margin:15px auto;width:30%;'  class = "example-full-width"> 
      <mat-label> <mat-icon matPrefix>search</mat-icon> Buscar CUIT</mat-label>
      <input  matInput (keyup)='updateFilter1($event)'> 
    </mat-form-field>    
    <mat-form-field  class="p-5"  style='padding:8px;margin:15px auto;width:30%;'  class = "example-full-width"> 
      <mat-label> <mat-icon matPrefix>search</mat-icon> Buscar Razón Social</mat-label>
      <input  matInput (keyup)='updateFilter($event)'> 
    </mat-form-field>    

    <ngx-datatable
          class="material ml-0 mr-0"
          [rows]="personas"
          [columnMode]="'force'"
          [headerHeight]="50"
          [footerHeight]="50"
          [externalPaging]="true" 
          [count]="page.totalElements" 
          [offset]="page.pageNumber"
          [limit]="page.size" 
          (page)='setPage($event)' 
          [rowHeight]="'auto'">
          <!-- <ngx-datatable-column name="No." [flexGrow]="1">
              <ng-template let-row="row" ngx-datatable-cell-template>
                {{ row?.id }}
              </ng-template>
           </ngx-datatable-column> -->
          <ngx-datatable-column name="Nombre" [flexGrow]="1">
            <ng-template let-row="row" ngx-datatable-cell-template>
              {{ row?.nombre }}
            </ng-template>
          </ngx-datatable-column>
          <ngx-datatable-column name="Apellidos" [flexGrow]="1">
            <ng-template let-row="row" ngx-datatable-cell-template>
              {{ row?.apellidos }}
            </ng-template>
          </ngx-datatable-column>
          <ngx-datatable-column name="Razón Social" [flexGrow]="1">
            <ng-template let-row="row" ngx-datatable-cell-template>
              {{ row?.razon_social }}
            </ng-template>
          </ngx-datatable-column>         
          <ngx-datatable-column name="Usuario" [flexGrow]="1">
            <ng-template let-row="row" ngx-datatable-cell-template>
              {{ row?.usuario }}
            </ng-template>
          </ngx-datatable-column>         
         <!--  <ngx-datatable-column name="Clave" [flexGrow]="1">
            <ng-template let-row="row" ngx-datatable-cell-template>
              {{ row?.clave }}
            </ng-template>
          </ngx-datatable-column>   -->       
          <ngx-datatable-column name="Acciones" [flexGrow]="1">
            <ng-template let-row="row" ngx-datatable-cell-template>
              <button mat-icon-button mat-sm-button color="primary" class="mr-1" matTooltip="Actualizar" (click)="openPopUp(row,false)"><mat-icon>edit</mat-icon></button>
              <button mat-icon-button mat-sm-button color="primary" class="mr-1" matTooltip="Asignar rol" (click)="openPopUpAsignarRol(row)"><mat-icon>assignment</mat-icon></button>
              <button mat-icon-button mat-sm-button color="primary" class="mr-1" matTooltip="Desactivar rol" (click)="openPopUpDesactivarRol(row)"><mat-icon>assignment_turned_in</mat-icon></button>
              <button mat-icon-button mat-sm-button color="warn" matTooltip="Eliminar" (click)="deleteItem(row)"><mat-icon>delete</mat-icon></button>
            </ng-template>
          </ngx-datatable-column>
        </ngx-datatable>
  </mat-card-content>
</mat-card>
