<div class="m-333">
  <h1 style="color: #124a99;">Desactivar/Activar Roles</h1>
</div>
<h1 matDialogTitle>Nombre Persona: {{ data.title }}</h1>
<form [formGroup]="itemForm" (ngSubmit)="submit()">
  <div fxLayout="row wrap" fxLayout.lt-sm="column">
    <div fxFlex="100" class="pr-1" hidden>
      <mat-form-field class="full-width">
        <input
          matInput
          name="id"
          [formControl]="itemForm.controls['id']"
          placeholder="Id de la Persona"
        />
      </mat-form-field>
    </div>
    <div fxFlex="100" class="pr-1">
      <div
        class="message-text"
        *ngFor="let rol of rolesxpersonaList; let i = index"
      >
        <mat-checkbox
          class="example-radio-button"
          [checked]="rol.activo == 1"
          (change)="onChange(i, rol, $event)"
          [(ngModel)]="rol.id"
          >{{ rol.nombre_rol }}</mat-checkbox
        >
      </div>
      <!-- <mat-form-field class="full-width">
        <mat-select placeholder="Roles" [formControl]="itemForm.controls['roles']" multiple>
          <mat-option *ngFor="let vrol of rolesList" [value]="vrol.id">{{vrol.descripcion}}</mat-option>
        </mat-select>
      </mat-form-field> -->
      <small
        *ngIf="
          itemForm.controls['roles'].hasError('required') &&
          itemForm.controls['roles'].touched
        "
        class="form-error-msg"
      >
        Es requerido el(os) rol(es).
      </small>
    </div>
    <div fxFlex="100" class="mt-1">
      <button
        mat-raised-button
        color="warn"
        type="button"
        (click)="dialogRef.close(false)"
      >
        Cancelar
      </button>
      <span fxFlex></span>
      <button mat-raised-button color="primary" [disabled]="!chanceValue">
        Guardar
      </button>
    </div>
  </div>
</form>
