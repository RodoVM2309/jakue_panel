<div class="sidebar-panel">
  <div id="scroll-area" [perfectScrollbar] class="navigation-hold" fxLayout="column">
    <!-- App Logo -->
    <div class="branding default-bg">
      <img *ngIf="rol!=='14'" [src]="ruta_logo | authImage | async" alt="" class="app-logo-text" style="height: 50px;">
      <!--<img src="assets/images/muvin/{{ruta_logo}}" alt="" class="app-logo" style="height: 50px;">-->
      <!-- <img src="assets/images/muvin/{{ruta}}" alt="" class="app-logo-text" style="height: 36px;"> -->
      <!-- Two different logos for dark and light themes -->
      <!-- <img src="assets/images/logo-text-white.png" alt="" class="app-logo-text" *ngIf="themeService.activatedTheme?.name?.indexOf('dark') !== -1">-->
      <!-- *ngIf="themeService.activatedTheme?.name?.indexOf('dark') === -1" -->
      <img *ngIf="rol==='14'" src="assets/images/muvin/izquierda-arriba-perfil-negro.png" alt="" class="app-logo">
    </div>

    <!-- Sidebar user -->
    <div class="app-user">
      <!-- <div class="app-user-photo">
        <img src="assets/images/muvin/izquierda-arriba-perfil.png" alt="">
      </div> -->
      <span class="app-user-name mb-05">
        <mat-icon class="icon-xs text-muted">lock</mat-icon>
        {{currentUser}}
      </span>
      <!-- Small buttons -->
      <div class="app-user-controls">
        <button class="text-muted" mat-icon-button mat-xs-button [matMenuTriggerFor]="appUserMenu">
          <mat-icon>settings</mat-icon>
        </button>
        <!-- <button class="text-muted" mat-icon-button mat-xs-button matTooltip="Inbox" routerLink="/inbox">
          <mat-icon>email</mat-icon>
        </button> -->
        <button class="text-muted" mat-icon-button mat-xs-button matTooltip="{{'SIGNOUT_APP' | translate}}"
          routerLink="/sessions/signin">
          <mat-icon>exit_to_app</mat-icon>
        </button>
        <mat-menu #appUserMenu="matMenu">
          <button mat-menu-item (click)="mostrarPerfil()" matTooltip="{{'MYPROFILE' | translate}}">
            <mat-icon>account_box</mat-icon>
            <span>{{'MYPROFILE' | translate}}</span>
          </button>
          <!-- <button mat-menu-item routerLink="/profile/settings">
            <mat-icon>settings</mat-icon>
            <span>Account Settings</span>
          </button>
          <button mat-menu-item routerLink="/calendar">
            <mat-icon>date_range</mat-icon>
            <span>Calendar</span>
          </button> -->
          <button mat-menu-item matTooltip="{{'SIGNOUT' | translate}}" routerLink="/sessions/signin">
            <mat-icon>exit_to_app</mat-icon>
            <span>{{'SIGNOUT' | translate}}</span>
          </button>
        </mat-menu>
      </div>
    </div>
    <!-- Navigation -->
    <app-sidenav [items]="menuItems" [hasIconMenu]="hasIconTypeMenuItem" [iconMenuTitle]="iconTypeMenuTitle">
    </app-sidenav>
  </div>
</div>
