<div class="margin-333" style="overflow-y: auto; overflow-x:hidden; height: 78vh;">
  <div fxLayout="column wrap">
    <div fxLayout="row wrap">
      <div fxFlex="100">
        <form id="form-cuponera1" [formGroup]="recuperarForm">
          <div fxLayout="row wrap" class="encabezado">
            <div fxFlex="100" class="row_encabezado">
              <div fxFlex="1"></div>
              <div fxFlex="15" fxLayoutAlign="center center" id="sele-producto" class="select_producto">
                <div fxFlex="100">
                  <div fxFlex="50" fxLayoutAlign="center center">
                    <span style="margin-left: 10px">PRODUCTOS:</span>
                  </div>
                  <div fxFlex="50">
                    <mat-form-field class="full-width">
                      <mat-select name="producto" (selectionChange)="aplicarFiltroProducto($event)" [formControl]="
                          recuperarForm.controls['selectedProducto']
                        ">
                        <mat-option *ngFor="let otrosp of productos" [value]="otrosp.id">
                          {{ otrosp.descripcion }}
                        </mat-option>
                      </mat-select>
                    </mat-form-field>
                  </div>
                </div>
              </div>
              <div fxFlex="2"></div>
              <div fxFlex="15" fxLayoutAlign="end start" id="fecha-bt1">
                <div fxFlex="100">
                  <div fxLayout="row wrap">
                    <div fxFlex="100">
                      <mat-form-field class="fecha-bt" id="fecha-bt1">
                        <input matInput placeholder="Rango Fecha" [satDatepicker]="picker"
                          formControlName="selectedFecha" (dateChange)="cambioRangoFecha(ref)" />
                        <sat-datepicker #picker [rangeMode]="true" [closeAfterSelection]="false"></sat-datepicker>
                        <sat-datepicker-toggle matSuffix [for]="picker"></sat-datepicker-toggle>
                      </mat-form-field>
                    </div>
                    <div fxFlex="100">
                      <small *ngIf="
                          recuperarForm.controls['selectedFecha'].hasError(
                            'rango'
                          )
                        " class="form-error-msg div-error">
                        No es posible un rango mayor a 30 días.
                      </small>
                    </div>
                  </div>
                </div>
              </div>
              <div fxFlex="2"></div>
              <div fxFlex="28" fxLayoutAlign="start start" id="sele-contraparte" [ngClass]="
                  disabledContraparte
                    ? 'select-contraparte-disabled'
                    : 'select-contraparte'
                ">
                <div fxFlex="100">
                  <div fxFlex="29">
                    <span style="margin-left: 10px">Cliente:</span>
                  </div>
                  <div fxFlex="70">
                    <mat-form-field class="full-width" *ngIf="!disabledContraparte">
                      <mat-select name="contraparte" (selectionChange)="aplicarFiltroContraparte($event)" [formControl]="
                          recuperarForm.controls['selectedContraparte']
                        ">
                        <mat-option *ngFor="let otroscp of contrapartes" [value]="otroscp.id">
                          {{ otroscp.descripcion }}
                        </mat-option>
                      </mat-select>
                    </mat-form-field>
                  </div>
                </div>
              </div>
              <div fxFlex="2"></div>
              <div fxFlex="26" fxLayoutAlign="start start">
                <input autofocus="true" placeholder="Buscar Cupo" type="text"
                  [formControl]="recuperarForm.controls['criterioBusqueda']" [ngClass]="'input-buscar'" />
              </div>
              <div fxFlex="9"></div>
            </div>
            <mat-divider></mat-divider>
            <div fxFlex="100" class="row_encabezado">
              <div fxFlex="1"></div>
              <div fxFlex="31" fxLayoutAlign="start start" id="sele-destinatario" class="select-destinatario">
                <div fxFlex="100">
                  <div fxFlex="30">
                    <span style="margin-left: 10px">Destinatarios:</span>
                  </div>
                  <div fxFlex="70">
                    <mat-form-field class="full-width">
                      <mat-select (selectionChange)="aplicarFiltroDestinatario($event)" name="destinatario"
                        [formControl]="
                          recuperarForm.controls['selectedDestinatario']
                        ">
                        <mat-option *ngFor="let otrosd of destinatarios" [value]="otrosd.id">
                          {{ otrosd.razon_social }}
                        </mat-option>
                      </mat-select>
                    </mat-form-field>
                  </div>
                </div>
              </div>
              <div fxFlex="3"></div>
              <div fxFlex="56" fxLayoutAlign="start start" id="sele-destino" [ngClass]="
                  disabledDestino ? 'select-destino-disabled' : 'select-destino'
                ">
                <div fxFlex="100">
                  <div fxFlex="30">
                    <span style="margin-left: 10px">Destino:</span>
                  </div>
                  <div fxFlex="70">
                    <mat-form-field class="full-width" *ngIf="!disabledDestino">
                      <mat-select name="destino" (selectionChange)="aplicarFiltroDestino($event)" [formControl]="
                          recuperarForm.controls['selectedDestino']
                        " [disabled]="disabledDestino">
                        <mat-option *ngFor="let otrosde of destinos" [value]="otrosde.id">
                          {{ otrosde.descripcion }}
                        </mat-option>
                      </mat-select>
                    </mat-form-field>
                  </div>
                </div>
              </div>
              <div fxFlex="1"></div>
              <div fxFlex="8" fxLayoutAlign="center center">
                <button mat-raised-button style="background-color: #174891" type="button" (click)="buscar()">
                  <span>BUSCAR</span>
                </button>
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>
    <div fxLayout="row wrap" class="div-table">
      <div fxFlex="100">
        <div fxLayout="row wrap">
          <div fxFlex="100" class="row_encabezado_table" style="display: flex; justify-content: end;">
            <div style="display: flex; width: auto;">
                <button mat-raised-button class="btnRecuperar" style="min-width: 9rem; margin-right: 10px;"  type="button" 
                [disabled]="cupos.length == 0 || selection.selected.length > 0"
                (click)="recoverAll()">
                RECUPERAR TODO
                </button>
                <button mat-raised-button class="btnRecuperar" type="button" [disabled]="selection.selected.length == 0"
                  (click)="recuperarCupos()">
                  RECUPERAR
                </button>
            </div>
          </div>
        </div>
        <div fxLayout="row wrap "  >
          <div fxFlex="100" style="overflow-y: auto !important; height: 450px !important; overflow-x: hidden !important">
            <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">
              <!-- <ng-container matColumnDef="corredor" style="height: 50px">
              <tr>
                <th mat-header-cell *matHeaderCellDef mat-sort-header class="mi-header-cell">
                  Corredor
                </th>
                <td mat-cell *matCellDef="let cupo; let i = index">
                  {{ cupo.corredor | uppercase }}
                </td>
              </tr>
            </ng-container> -->
              <ng-container matColumnDef="contraparte">
                <th mat-header-cell *matHeaderCellDef mat-sort-header class="mi-header-cell">
                  Cliente
                </th>
                <td mat-cell *matCellDef="let cupo">
                  {{ cupo.contraparte | uppercase }}
                </td>
              </ng-container>
              <ng-container matColumnDef="fecha">
                <th mat-header-cell *matHeaderCellDef mat-sort-header class="mi-header-cell">
                  Fecha
                </th>
                <td mat-cell *matCellDef="let cupo">
                  {{ cupo.fecha }}
                </td>
              </ng-container>
              <ng-container matColumnDef="idCupoTerminal">
                <th mat-header-cell *matHeaderCellDef mat-sort-header class="mi-header-cell">
                  Cupo
                </th>
                <td mat-cell *matCellDef="let cupo">
                  {{ cupo.idCupoTerminal }}
                </td>
              </ng-container>
              <ng-container matColumnDef="select">
                <th mat-header-cell *matHeaderCellDef class="mi-header-cell">
                  <div fxLayout="row wrap" fxLayoutAlign="center center" style="margin-left: 25px">
                    <div fxFlex="100" fxLayoutAlign="end center">
                      <mat-checkbox style="margin-right: 15px" (change)="$event ? masterToggle() : null"
                        [checked]="selection.hasValue() && isAllSelected()" [disabled]="dataSource.data.length == 0"
                        [indeterminate]="selection.hasValue() && !isAllSelected()" [aria-label]="checkboxLabel()">
                      </mat-checkbox>
                    </div>
                  </div>
                </th>
                <td mat-cell *matCellDef="let cupo; let i = index">
                  <div style="text-align: right; margin-right: 15px">
                    <mat-checkbox (click)="$event.stopPropagation()" (change)="$event ? selection.toggle(cupo) : null"
                      [checked]="selection.isSelected(cupo)" [aria-label]="checkboxLabel(cupo)">
                    </mat-checkbox>
                  </div>
                </td>
              </ng-container>

              <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
              <tr mat-row *matRowDef="let row; columns: displayedColumns" (click)="selection.toggle(row)"></tr>
            </table>
          </div>
        </div>
      </div>
      <!-- Aqui debajo viene el pagination -->
      <div fxLayout="row wrap" class="pagination">
        <div fxFlex="100" fxLayoutAlign="end center">
          <mat-paginator #paginator class="mat-paginator-sticky"  [pageSize]="pageEvent.pageSize"
            [showFirstLastButtons]="true" [length]="pageEvent.length">
          </mat-paginator>
        </div>
      </div>
    </div>
  </div>
</div>
