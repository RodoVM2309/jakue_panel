<div class="component" fxLayout="column wrap">
  <div class="encabezado" fxLayout="row wrap">
    <div fxFlex="100">
      <div fxFlex="5"></div>
      <div fxFlex="95" fxLayoutAlign="start center">
        <strong>APLICAR CABECERA CCPP A CUPOS SELECCIONADOS</strong>
      </div>
    </div>
  </div>
  <div fxLayout="row wrap" class="sub-encabezado" fxLayoutAlign="center center">
    <div fxFlex="100">
      <div fxFlex="5">
      </div>
      <div fxFlex="30" fxLayoutAlign="start center">
        <strong style="font-size: 14px;">Cupos Seleccionados: </strong>
        <strong *ngIf="cupos.length<10" style="font-size: 16px;">&nbsp;&nbsp;0{{cupos.length}}</strong>
        <strong *ngIf="cupos.length>9" style="font-size: 16px;">&nbsp;&nbsp;{{cupos.length}}</strong>
      </div>
      <div fxFlex="13">
        <strong style="font-size: 14px;">Fecha&nbsp;</strong>
        <strong style="font-size: 16px;"> {{data.payload.fecha}}</strong>
      </div>
      <div fxFlex="52">
        <strong style="font-size: 14px;">Producto: </strong>
        <strong style="font-size: 16px;">{{data.payload.producto | uppercase }}.</strong>
      </div>
    </div>
  </div>
  <div class="cuerpo" fxLayout="column wrap">
    <div fxLayout="row wrap" class="add_cabecera" fxLayoutAlign="center center">
      <div fxFlex="100">
        <div fxFlex="5">
        </div>
        <div fxFlex="95" fxLayoutAlign="start center">
          <strong style="font-size: 14px;">CABECERAS DISPONIBLES : </strong>
          <button mat-icon-button matTooltip="Adicionar cabeceras" color="m-0" class="m-0"
            style="height: 45px;width: 45px; padding: 7px;" (click)="openPopUpNuevaCabecera({}, true)">
            <mat-icon fxFlex="30%" style="font-size: 35px; margin-top: 5px; color: #86B1C5">add_circle
            </mat-icon>
          </button>

        </div>
      </div>
    </div>
    <div fxLayout="row wrap" class="div-asignar">
      <div fxFlex="100">
        <div fxFlex="3">
        </div>
        <div fxFlex="97">
          <table mat-table [dataSource]="dataSource" matSort>
            <ng-container matColumnDef="titulo">
              <tr>
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Título</th>
                <td mat-cell *matCellDef="let cupo; let i = index">
                  {{cupo.titulo}}
                </td>
              </tr>
            </ng-container>

            <ng-container matColumnDef="detalle">
              <th mat-header-cell *matHeaderCellDef mat-sort-header>Ver Detalle
              </th>
              <td mat-cell *matCellDef="let cupo; let i = index">
                <button mat-icon-button matTooltip="Adicionar cabeceras" class="m-0"
                  style="height: 45px;width: 45px; padding: 7px;" (click)="verDetalle(cupo)">
                  <mat-icon fxFlex="30%" style="font-size: 20px; color: #93BD26">visibility
                  </mat-icon>
                </button>
              </td>
            </ng-container>
            <ng-container matColumnDef="seleccionar">
              <th mat-header-cell *matHeaderCellDef>Seleccionar</th>
              <td mat-cell *matCellDef="let cupo; let i = index">
                <div style="text-align: center;">
                  <mat-checkbox class="example-radio-button" [(ngModel)]="cupo.selected" [disabled]="cupo.habilitado"
                    (change)="onCheckboxChange($event, cupo,i)">
                  </mat-checkbox>
                </div>
              </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
          </table>
        </div>
      </div>
    </div>
    <div fxLayout="row wrap" class="div-paginator">
      <div fxFlex="100">
        <mat-paginator #paginator class="mat-paginator-sticky" showFirstLastButtons
        [pageIndex]="page.pageNumber"
        [length]="page.totalElements" [pageSize]="page.size" (page)="setPage($event)">
        </mat-paginator>
      </div>
    </div>
  </div>
  <div class="footer" fxLayout="row wrap">
    <div fxFlex="100" fxLayoutAlign="center center">
      <div fxFlex="4"></div>
      <div fxFlex="44" fxLayoutAlign="center center">
        <button mat-raised-button style="background-color: black; width: 200px;color: #ffffff !important;" type="button"
          (click)="dialogRef.close(false)">
          CANCELAR
        </button>
      </div>
      <div fxFlex="14"></div>
      <div fxFlex="34" fxLayoutAlign="start center">
        <button mat-raised-button style="background-color: rgb(23,72,145);width: 200px;color: #ffffff !important;"
        [disabled]="!isSelected" (click)="submit()"
        >
          APLICAR
        </button>
      </div>
      <div fxFlex="4"></div>

    </div>
  </div>
</div>
