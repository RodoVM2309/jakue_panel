<div fxLayout="row wrap">
  <div class="encabezadoInfo" fxLayout="row wrap">
    <div fxFlex="100" fxLayoutAlign="start center">
      <div fxFlex="6"></div>
      <div fxFlex="84" fxLayoutAlign="start center">
        <strong> INFORMACION DE CUPOS </strong>
      </div>
      <div fxFlex="10">
        <button mat-icon-button matTooltip="Cerrar información de cupos" color="m-0" class="m-0" (click)="submit()">
          <mat-icon>cancel</mat-icon>
        </button>
      </div>
    </div>
  </div>
  <div class="cuerpoInfo">
    <div fxLayout="row wrap">
      <div fxFlex="100" style="
          background: rgb(207, 207, 212);
          color: rgb(8, 8, 8);
          height: 50px;
        ">
        <div fxFlex="6" style="margin-top: 15px;"></div>
        <div fxFlex="30" fxLayoutAlign="start center">
          <strong style="font-size: 14px">PRODUCTO: </strong>
          <strong style="font-size: 14px"> {{ data.payload.producto | uppercase}}</strong>
        </div>
        <div fxFlex="30" fxLayoutAlign="center center">
          <strong style="font-size: 14px">FECHA CUPO: </strong>
          <strong style="font-size: 14px"> {{ newFecha }} </strong>
        </div>
        <div fxFlex="30" fxLayoutAlign="end center">
          <strong style="font-size: 14px">CANTIDAD DE CUPOS: </strong>
          <strong style="font-size: 14px">{{ cupos.length }}</strong>
        </div>
        <div fxFlex="4"></div>
      </div>
    </div>
    <div fxLayout="row wrap" class="div-table">
      <div fxFlex="100">
        <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8" style="box-shadow: none">
          <ng-container matColumnDef="first_column">
            <th mat-header-cell *matHeaderCellDef style="text-align: center"></th>
            <td mat-cell *matCellDef="let cupo">
              <!-- <div *ngIf="cupo.asignado=='0'" style="background:#87B1C5; height: 100%; text-align: center;">
                            <mat-icon *ngIf="cupo == expandedElement" style="color: #FCFDFF; ">expand_more </mat-icon>
                            <mat-icon *ngIf="cupo !== expandedElement" style="color: #FCFDFF; ">chevron_right
                            </mat-icon>
                        </div>
                        <div *ngIf="cupo.asignado=='1'"
                            style="background:rgb(176, 235, 110); height: 100%; text-align: center;">
                            <mat-icon *ngIf="cupo == expandedElement" style="color: #FCFDFF; ">expand_more </mat-icon>
                            <mat-icon *ngIf="cupo !== expandedElement" style="color: #FCFDFF; ">chevron_right
                            </mat-icon>
                        </div> -->
              <!-- <div class="circulo_verde" fxLayoutAlign="end center"></div> -->
            </td>
            <td mat-footer-cell *matFooterCellDef></td>
          </ng-container>
          <ng-container matColumnDef="alfanumericoCupo">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>CUPO</th>
            <td mat-cell *matCellDef="let cupo">
              <div>{{ cupo.idCupoterminal }}</div>
            </td>
            <td mat-footer-cell *matFooterCellDef></td>
          </ng-container>
          <!-- <ng-container matColumnDef="numeroContrato">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>
              CONTRATO/FIJACIÓN
            </th>
            <td mat-cell *matCellDef="let cupo">
              <div>{{ cupo.nroContrato }}</div>
            </td>
            <td mat-footer-cell *matFooterCellDef></td>
          </ng-container>
          <ng-container matColumnDef="cccp">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>CP</th>
            <td mat-cell *matCellDef="let cupo">
              <button mat-icon-button mat-sm-button color="primary" class="mr-1" (click)="openPopUpVer(cupo)"
                matTooltip="Ver">
                <mat-icon style="color: #93bd26">visibility</mat-icon>
              </button>
            </td>
            <td mat-footer-cell *matFooterCellDef></td>
          </ng-container> -->
          <!-- Checkbox Column -->
          <ng-container matColumnDef="select">
            <th mat-header-cell *matHeaderCellDef>
              <mat-checkbox (change)="$event ? masterToggle() : null" [disabled]="countEnabled()===0"
                [checked]="selection.hasValue() && isAllSelected() "
                [indeterminate]="selection.hasValue() && !isAllSelected()" [aria-label]="checkboxLabel()">
              </mat-checkbox>
            </th>
            <td mat-cell *matCellDef="let row">
              <mat-checkbox (click)="$event.stopPropagation()" [disabled]="!row.habilitado"
                (change)="$event ? selection.toggle(row) : null" [checked]="selection.isSelected(row)"
                [aria-label]="checkboxLabel(row)">
              </mat-checkbox>
            </td>
            <td mat-footer-cell *matFooterCellDef></td>
          </ng-container>

          <!-- <ng-container matColumnDef="expandedDetail">
              <td mat-cell *matCellDef="let cupo" [attr.colspan]="displayedColumns.length">
                <div class="example-element-detail" [@detailExpand]="
                    cupo == expandedElement ? 'expanded' : 'collapsed'
                  ">
                  <div class="example-element-description">
                    <strong style="font-size: 14px; color: black">Observaciones:</strong>
                    <p style="color: black">{{ cupo.observaciones }}</p>

              </td>
            </ng-container>
            [class.example-expanded-row]="expandedElement === cupo"
              (click)="expandedElement = expandedElement !== cupo ? cupo : null"
           -->

          <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="example-element-row"></tr>
          <tr mat-footer-row *matFooterRowDef="displayedColumns"></tr>

          <!--  <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
        <tr mat-row *matRowDef="let cupo; columns: displayedColumns" class="example-element-row"></tr>
        <tr mat-row *matRowDef="let row; columns: ['expandedDetail']" class="example-detail-row"></tr>
        <tr mat-footer-row *matFooterRowDef="displayedColumns; sticky: true"></tr> -->
        </table>
        <div class="footer" fxLayout="row wrap" *ngIf="usaMTR">
          <div fxFlex="100" fxLayoutAlign="start start">
            <div fxFlex="78"></div>
            <div fxFlex="20" fxLayoutAlign="end start">
              <button mat-raised-button class="btn btn-confirmar mat-cupo-rechazar"
                [disabled]="this.selection.selected.length===0" (click)="rechazar()"
                fxLayoutAlign="center center">RECHAZAR</button>
            </div>
            <div fxFlex="2"></div>
          </div>
        </div>
      </div>

  </div>
