<div id="app-filtrosSolicitudes">
  <div class="handle" *ngIf="!isCustomizerOpen" style="color: #fff; margin-right:28px;">
    <p style="margin: 4px 10px 0px; font-size: small;">Filtrar</p>
    <button mat-fab class="mat-rojo-filtrar" (click)="isCustomizerOpen = true" matTooltip="Filtrar Solicitudes">
      <mat-icon>filter_list</mat-icon>
    </button>
  </div>
  <mat-card class="p-0" *ngIf="isCustomizerOpen">
    <mat-card-title class="mat-rojo-filtrar">
      <div class="card-title-text">
        <span>Filtrar Solicitudes</span>
        <span fxFlex></span>
        <button class="card-control" mat-icon-button (click)="isCustomizerOpen = false">
          <mat-icon>close</mat-icon>
        </button>
      </div>
    </mat-card-title>
    <mat-card-content>
      <button mat-icon-button (click)="limpiarFiltros()">
        <mat-icon matTooltip="Limpiar filtros">autorenew</mat-icon>
      </button>
      <div fxLayout="row wrap" fxLayout.lt-sm="column">

        <mat-checkbox class="example-radio-button" [checked]="filtro.oculto" (change)="onCheckboxChange($event.checked)"
          matTooltip="Solicitudes ocultas">Solicitudes ocultas
        </mat-checkbox>
      </div>
    </mat-card-content>
  </mat-card>
</div>
<div class="margin-10 width-99">
  <div fxFlex="100">
    <mat-card class="my-card" style="overflow-y: auto;">
      <!-- <mat-card
        style="box-shadow: 0 0px 0px 0px rgba(0, 0, 0, 0), 0 2px 2px 0 rgba(0, 0, 0, 0), 0 1px 5px 0 rgba(0, 0, 0, 0) !important; background: #53ccfc; padding: 0px; margin-top: -25px;"
        [style.overflow]="'auto'" [style.width.px]="'100%'" [style.height.px]="'5'">
      </mat-card> -->
      <div fxLayout="row wrap">
        <div fxFlex="100" class="example-container mat-elevation-z8">
          <table mat-table [dataSource]="dataSource" matSort (matSortChange)="customSortVoid($event)">
            <ng-container matColumnDef="first_color">
              <th mat-header-cell *matHeaderCellDef style="text-align: center;" ></th>
              <td mat-cell *matCellDef="let solicitud" style="width: 5px;height: 40px;">
                <div [matTooltip]="solicitud.motivos" [ngClass]="{ 'solicitud-acept' : solicitud.motivo == null , 'solicitud-reject': solicitud.motivo != null }" style=" height: 100%; text-align: center;">
                  <mat-icon *ngIf="solicitud == expandedElement" style="color: #FCFDFF; ">expand_more </mat-icon>
                  <mat-icon *ngIf="solicitud !== expandedElement" style="color: #FCFDFF; ">chevron_right </mat-icon>
                </div>
              </td>
            </ng-container>
            <ng-container matColumnDef="producto" >
              <th mat-header-cell *matHeaderCellDef style="text-align: center;">Producto</th>
              <td mat-cell *matCellDef="let solicitud">
                {{solicitud.nombreProducto}}
              </td>
            </ng-container>
            <ng-container matColumnDef="fechaCupo">
              <th mat-header-cell *matHeaderCellDef  mat-sort-header  style="text-align: center;">Fecha</th>
              <td mat-cell *matCellDef="let solicitud" >
                {{solicitud.fechaCupo}}
              </td>
            </ng-container>
            <ng-container matColumnDef="nombreDemandado">
              <th mat-header-cell *matHeaderCellDef  mat-sort-header  style="text-align: center;">Dador cupos</th>
              <td mat-cell *matCellDef="let solicitud" >
                {{solicitud.nombreDemandado}}
              </td>
            </ng-container>
            <ng-container matColumnDef="contraparte" >
              <th mat-header-cell *matHeaderCellDef  mat-sort-header  style="text-align: center;">Cliente</th>
              <td mat-cell *matCellDef="let solicitud">
                  {{solicitud.nombreContraparte}}
              </td>
            </ng-container>
            <ng-container matColumnDef="cantidad" >
              <th mat-header-cell *matHeaderCellDef  mat-sort-header  style="text-align: center;">Solicitados</th>
              <td mat-cell *matCellDef="let solicitud">
                <button mat-mini-fab style="box-shadow: none; width: 35px; height: 35px;" color="indicador-total"
                  class="mr-2">
                  {{ solicitud.cantidad}}
                </button>
              </td>
            </ng-container>
            <ng-container matColumnDef="asignado" >
              <th mat-header-cell *matHeaderCellDef style="text-align: center;">Recibidos</th>
              <td mat-cell *matCellDef="let solicitud" style="text-align: center;">
                <button mat-mini-fab style="box-shadow: none; width: 35px; height: 35px;" color="indicador-pend_asignar"
                  class="mr-2" (click)="cargarAlfanumerico('total', solicitud, false)">
                  {{solicitud.asignado}}
                </button>
              </td>
            </ng-container>
            <ng-container matColumnDef="sin_ctg" >
              <th mat-header-cell *matHeaderCellDef style="text-align: center;color: #EB5700;">
                Sin CTG
              </th>
              <td mat-cell *matCellDef="let solicitud" style="text-align: center" >
                <ng-container *ngIf="solicitud.sin_ctg>0; else elseTemplate">
                  <button (click)="cargarAlfanumerico('sin_ctg', solicitud, false)" mat-mini-fab
                  style="box-shadow: none; width: 35px; height: 35px" color="indicador-sin-ctg" class="mr-2">
                  {{ solicitud.sin_ctg }}
                </button>
                </ng-container>
                <ng-template #elseTemplate>
                   <button  mat-mini-fab
                  style="box-shadow: none; width: 35px; height: 35px" color="indicador-sin-ctg" class="mr-2">
                  {{ solicitud.sin_ctg }}
                </button>
                </ng-template>
              </td>
            </ng-container>
            <ng-container matColumnDef="ctg" >
              <th mat-header-cell *matHeaderCellDef   style="text-align: center;" >CTG</th>
              <td mat-cell *matCellDef="let solicitud" style="text-align: center;">
                <ng-container *ngIf="solicitud.ctg>0; else elseTemplate">
                  <button (click)="cargarAlfanumerico('ctg', solicitud, false)" mat-mini-fab
                  style="box-shadow: none; width: 35px; height: 35px;" color="indicador-ctg" class="mr-2">
                  {{solicitud.ctg}}
                </button>
                </ng-container>
                <ng-template #elseTemplate>
                  <button  mat-mini-fab
                  style="box-shadow: none; width: 35px; height: 35px;" color="indicador-ctg" class="mr-2">
                  {{solicitud.ctg}}
                </button>
                </ng-template>
              </td>
            </ng-container>
            <ng-container matColumnDef="en_destino">
              <th mat-header-cell *matHeaderCellDef   style="text-align: center;">En destino</th>
              <td mat-cell *matCellDef="let solicitud" style="text-align: center;">
                <ng-container *ngIf="solicitud.en_destino>0; else elseTemplate">
                  <button (click)="cargarAlfanumerico('en_destino', solicitud, false)" mat-mini-fab
                  style="box-shadow: none; width: 35px; height: 35px;" color="indicador-en_destino"
                  class="mr-2">
                  {{solicitud.en_destino}}
                </button>
                </ng-container>
                <ng-template #elseTemplate>
                  <button  mat-mini-fab
                  style="box-shadow: none; width: 35px; height: 35px;" color="indicador-en_destino"
                  class="mr-2">
                  {{solicitud.en_destino}}
                </button>
                </ng-template>

              </td>
            </ng-container>
            <ng-container matColumnDef="descargados">
              <th mat-header-cell *matHeaderCellDef  style="text-align: center;">Descargados</th>
              <td mat-cell *matCellDef="let solicitud" style="text-align: center;">
                <ng-container *ngIf="solicitud.descargado>0; else elseTemplate">
                  <button (click)="cargarAlfanumerico('descargado', solicitud, false)" mat-mini-fab
                  style="box-shadow: none; width: 35px; height: 35px;" color="indicador-en_destino"
                  class="mr-2">
                  {{solicitud.descargado}}
                </button>
                </ng-container>
                <ng-template #elseTemplate>
                  <button  mat-mini-fab
                  style="box-shadow: none; width: 35px; height: 35px;" color="indicador-en_destino"
                  class="mr-2">
                  {{solicitud.descargado}}
                </button>
                </ng-template>
              </td>
            </ng-container>

            <ng-container matColumnDef="acciones">
              <th mat-header-cell *matHeaderCellDef   style="text-align: center;">Acciones</th>
              <td mat-cell *matCellDef="let solicitud" style="text-align: center;">
                <div fxLayout="row wrap">
                  <div fxFlex="100">

                      <button mat-menu-item (click)="openPopUpChanceDemanda(solicitud,$event)" style="text-align: center;">
                        <mat-icon matTooltip="Modificar la cantidad">edit
                        </mat-icon>
                      </button>
                  </div>
                </div>
              </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
          </table>
          <mat-paginator #paginator class="mat-paginator-sticky" [length]="totalSize" [pageIndex]="pageIndex"
            [pageSize]="pageSize" (page)="getServerData(true,$event)"
            [showFirstLastButtons]="true">
          </mat-paginator>
        </div>
      </div>
    </mat-card>
  </div>
</div>
