<mat-card class="p-0 div-margin" [ngClass]="cupera===2 ? 'div-margin-1': 'div-margin-2'">
  <mat-card-title class="">
    <div class="card-title-text" style="
            background: #004a90;
            color: white;
            font-weight: 400;
            font-size: larger;
            padding: 0px;
          ">
      <div fxFlex="100">
        <div fxFlex="3"></div>
        <div fxFlex="92" fxLayoutAlign="start start" style="margin-top:15px;">
          <h3>DETALLES DE LOS CUPOS</h3>
        </div>
        <span FxFlex></span>
        <div fxFlex="5" style="margin-top:8px;margin-left:15px;">
          <button mat-icon-button matTooltip="Cerrar información de cupos" color="m-0" class="m-0" (click)="submit()">
            <mat-icon>cancel</mat-icon>
          </button>
        </div>
      </div>
    </div>
  </mat-card-title>
  <mat-card-content>
    <div class="cuerpo" fxLayout="column wrap">
      <div fxLayout="row wrap">
        <div fxFlex="100" style="background: rgb(207, 207, 212); color: rgb(8, 8, 8);height: 50px;">
          <div fxFlex="3"></div>
          <div fxFlex="59" style="margin-top:15px;">
            <strong style="font-size: 16px;">Titulo: Estado: </strong>
            <strong style="font-size: 14px;"> {{ this.data.title }}</strong>
          </div>
          <div fxFlex="35" fxLayoutAlign="end start" style="margin-top:15px;">
            <strong style="font-size: 16px;">Total de Cupos: {{dataSource.data.length}}</strong>
          </div>
          <div fxFlex="3"></div>
        </div>
      </div>
      <div fxLayout="row wrap" *ngIf="mostrarRecuperar">
        <div fxFlex="100" class="row_encabezado_table">
          <div fxFlex="85"></div>
          <div fxFlex="15" fxLayoutAlign="center center">
            <button
              mat-raised-button
              class="btnRecuperar"
              type="button"
              [disabled]="selection.selected.length == 0"
              (click)="recuperarCupos()"
            >
              RECUPERAR
            </button>
          </div>
        </div>
      </div>
      <div fxLayout="row wrap" class="example-container mat-elevation-z8">
        <div fxFlex="100"  class="table-container">
          <table mat-table [dataSource]="dataSource" matSort multiTemplateDataRows class="mat-elevation-z8">
            <ng-container matColumnDef="alfanumericoCupo">
              <th mat-header-cell *matHeaderCellDef mat-sort-header>Cupo</th>
              <td mat-cell *matCellDef="let cupo">
                <div>{{cupo.alfanumericoCupo }}</div>
              </td>
            </ng-container>
            <ng-container matColumnDef="razonSocial">
              <th mat-header-cell *matHeaderCellDef mat-sort-header>Razon Social</th>
              <td mat-cell *matCellDef="let cupo">
                <div>{{ cupo.razonSocial }}</div>
              </td>
            </ng-container>

            <ng-container matColumnDef="select">
              <th mat-header-cell *matHeaderCellDef class="mi-header-cell">
                <div
                  fxLayout="row wrap"
                  fxLayoutAlign="center center"
                  style="margin-left: 25px"
                >
                  <div fxFlex="100" fxLayoutAlign="end center">
                    <mat-checkbox *ngIf="mostrarRecuperar"
                      style="margin-right: 15px"
                      (change)="$event ? masterToggle() : null"
                      [checked]="selection.hasValue() && isAllSelected()"
                      [disabled]="dataSource.data.length == 0 || countRecuperable==0"
                      [indeterminate]="selection.hasValue() && !isAllSelected()"
                      [aria-label]="checkboxLabel()"
                    >
                    </mat-checkbox>
                  </div>
                </div>
              </th>
              <td mat-cell *matCellDef="let cupo; let i = index">
                <div style="text-align: right; margin-right: 15px">
                  <mat-checkbox *ngIf="mostrarRecuperar"
                    (click)="$event.stopPropagation()"
                    (change)="$event ? selection.toggle(cupo) : null"
                    [checked]="selection.isSelected(cupo)"
                    [disabled]="!cupo.recuperable"
                    [aria-label]="checkboxLabel(cupo)"
                  >
                  </mat-checkbox>
                </div>
              </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
            <tr mat-row *matRowDef="let cupo; columns: displayedColumns"></tr>

          </table>
        </div>
      </div>
    </div>
  </mat-card-content>

</mat-card>
