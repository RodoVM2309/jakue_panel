<br>
<div class="m-333">
    <h4 style="color:#124A99;">Panel Cupos</h4>
</div>
<mat-card>
    <kendo-grid [data]="gridView" [groupable]="true" [height]="400" [group]="groups" style="width: 100%" (groupChange)="groupChange($event)">
        <kendo-grid-messages
            groupPanelEmpty="Arrastrar hasta aquí el título de la columna que desee agrupar." 
            pagerPage="Página"
            pagerOf="de"
            pagerItems="viaje"
            pagerItemsPerPage="viaje por página">
        </kendo-grid-messages>
        <div *ngIf="rolDador== true">
            <kendo-grid-column field="centro" title="Centro Muvin" width="60">
            </kendo-grid-column> 
        </div>
        <kendo-grid-column field="nombre_chofer" title="Chofer" width="60">
        </kendo-grid-column>        
        <kendo-grid-column field="fecha" title="Fecha Carga" width="50">
            <ng-template kendoGridGroupHeaderTemplate let-value="value">
            {{value}}
            </ng-template>
        </kendo-grid-column>
        <kendo-grid-column field="fecha" title="Fecha Cupo" width="50">
        </kendo-grid-column>
        <kendo-grid-column field="nombre_destino" title="Destino" width="70">
        </kendo-grid-column>
        <kendo-grid-column field="nombre_destinatario" title="Destinatario" width="60">
        </kendo-grid-column>
        <kendo-grid-column field="carta_porte" title="Carta Porte" width="50">
        </kendo-grid-column>
        <kendo-grid-column field="cupo" title="Cupo" width="50">
        </kendo-grid-column>
        <kendo-grid-column field="nombre_estado_viaje" title="Estado" width="60">
        </kendo-grid-column>
        <kendo-grid-column field="id_estado_viaje" title="Km" width="50">
            <ng-template kendoGridCellTemplate let-dataItem>
            <div *ngIf="dataItem.id_estado_viaje < 3 ">{{dataItem.distancia_origen}}</div>
            <div *ngIf="dataItem.id_estado_viaje >= 3 ">{{dataItem.distancia_destino}}</div>
            </ng-template>
        </kendo-grid-column>
        <kendo-grid-column field="nombre_corredor" title="Corredor" width="60">
        </kendo-grid-column>
        <kendo-grid-column field="nombre_entregador" title="Entregador" width="60">
        </kendo-grid-column>        
        <kendo-grid-column field="nombre_tipo_camion" title="Tipo" width="40">
        </kendo-grid-column>   
        <kendo-grid-column field="nombre_intermediario" title="Intermediario" width="70">
        </kendo-grid-column>      
    </kendo-grid>    
</mat-card>
