<mat-card-title class="">
  <div class="card-title-text">CANTIDAD A MODIFICAR</div>
  <mat-divider></mat-divider>
</mat-card-title>

  <div fxLayout="row wrap" fxLayout.lt-sm="column">
    <div fxFlex="50" class="pr-1" hidden>
      <mat-form-field class="full-width">
        <input
          matInput
          name="id"
          [formControl]="itemForm.controls['id']"
          placeholder=""
        />
      </mat-form-field>
    </div>

    </div>
    <div fxFlex="50" class="pr-1">
      <mat-form-field class="full-width">
        <input readonly matInput name="zonaDestino" [formControl]="itemForm.controls['zonaDestino']" placeholder="Zona de Destino">
      </mat-form-field>
    </div>
    <div fxFlex="50" class="pr-1">

        <input readonly matInput name="dador" [formControl]="itemForm.controls['dador']" placeholder="Nombre del Cliente">

      </mat-form-field>
    </div>
    <div fxFlex="50" class="pr-1">
      <mat-form-field class="full-width">
        
        <input readonly matInput name="viajeAsignados" [formControl]="itemForm.controls['viajeAsignados']" placeholder="Asignados">
      </mat-form-field>
    </div>
    <div fxFlex="50" class="pr-1">
      <mat-form-field class="full-width">
        
        <input readonly matInput name="reduccion" [formControl]="itemForm.controls['reduccion']" placeholder="Reducciones">
      </mat-form-field>
    </div>
    <div fxFlex="50" class="pr-1">

    <mat-divider></mat-divider>
    <div fxFlex="50" class="pr-1">
      <mat-form-field class="full-width">
        Aumente o Disminuya la cantidad a modificar:
        <input
          matInput
          class="quantity-input default-bg"
          name="quantity"
          type="number"
          [formControl]="itemForm.controls['quantity']"
        />
        <small
          *ngIf="
            itemForm.controls['quantity'].hasError('required') &&
            itemForm.controls['quantity'].touched
          "
          class="form-error-msg"
        >
          Es requerido la cantidad a modificar</small
        >
      </mat-form-field>
    </div>

    <div fxFlex="100" class="mt-1">
      <button
        mat-raised-button
        color="warn"
        type="button"
        (click)="dialogRef.close(false)"
      >
        Cancelar
      </button>
      <span fxFlex></span>
      <button mat-raised-button color="primary" [disabled]="itemForm.invalid">
        Guardar
      </button>
    </div>
  </div>
</form>
