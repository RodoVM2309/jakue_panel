<div class="margin-333">
  <div fxLayout="row wrap">
    <div fxFlex="100" *ngIf="!variables.showTable">
      <div fxFlex="100">
        <mat-card
          style="box-shadow: 0 0px 0px 0px rgba(0, 0, 0, 0), 0 2px 2px 0 rgba(0, 0, 0, 0), 0 1px 5px 0 rgba(0, 0, 0, 0) !important; "
          [style.overflow]="'auto'" [style.width.px]="'100%'">
          <h4 class="classname">No hay Cupos Disponibles</h4>
        </mat-card>
      </div>
    </div>
  </div>
  <form [formGroup]="variables.filtrarForm">
    <div fxLayout="row wrap" style=" width: 95%;background: #ffffff; margin-left: 35px; padding: 0px; margin-top: 9px;">
      <div fxFlex="100" style="height: 50px;" class="pr-1">
        <div fxFlex="1"></div>
        <div fxFlex="15" fxLayoutAlign="start start" style="margin-right: 15px;">
          <mat-form-field>
            <mat-label>Producto</mat-label>
            <mat-select id="producto" placeholder="Producto" (selectionChange)="aplicarFiltro('id_producto', $event)"
              formControlName="selectedProducto" name="producto" class="mb-1" placeholder="Producto">
              <mat-option *ngFor="let producto of variables.productos" [value]="producto.id" ngDefaultControl>
                {{ producto.descripcion }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>
        <div fxFlex="15" fxFlex.gt-xs="15" class="pr-1" id="fecha-bt1">
          <mat-form-field class="full-width fecha-bt">
            <input matInput name="fechaFilter" formControlName="selectedFecha" placeholder="Fecha"
              [matDatepicker]="appDatepicker" (dateChange)="aplicarFiltro('fechaCupo', $event)" />
            <mat-datepicker-toggle matSuffix [for]="appDatepicker">
            </mat-datepicker-toggle>
          </mat-form-field>
          <mat-datepicker #appDatepicker></mat-datepicker>
        </div>
        <div fxFlex="10" fxFlex.gt-xs="10" fxLayoutAlign="start center">
          <button mat-icon-button matTooltip="Limpiar Filtro" color="mr-0" class="mr-0" (click)="limpiarFiltros()"
            style="text-align: center;padding-left: 0px">
            <mat-icon>delete_outline</mat-icon>
          </button>
        </div>
        <div fxFlex="59"></div>

      </div>
    </div>
  </form>
  <div fxLayout="row wrap">
    <div fxFlex="100">
      <mat-card
        style="box-shadow: 0 0px 0px 0px rgba(0, 0, 0, 0), 0 2px 2px 0 rgba(0, 0, 0, 0), 0 1px 5px 0 rgba(0, 0, 0, 0) !important; background: #E9E9EA;"
        [style.overflow]="'auto'" [style.width.px]="'100%'">
        <mat-card
          style="box-shadow: 0 0px 0px 0px rgba(0, 0, 0, 0), 0 2px 2px 0 rgba(0, 0, 0, 0), 0 1px 5px 0 rgba(0, 0, 0, 0) !important; background: #53ccfc; padding: 0px; margin-top: 5px;"
          [style.overflow]="'auto'" [style.width.px]="'100%'" [style.height.px]="'5'">
        </mat-card>
        <div fxLayout="row wrap">
          <div fxFlex="100" class="example-container mat-elevation-z8">
            <table mat-table [dataSource]="dataSource" matSort>
              <ng-container matColumnDef="copiar">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>
                  <button mat-icon-button matTooltip="Refrescar" color="mr-1" class="mr-1" (click)="gotoRefresh()">
                    <mat-icon>refresh</mat-icon>
                  </button>
                </th>
                <td mat-cell *matCellDef="let row" data-label="id">
                  <button mat-icon-button matTooltip="Copiar" (click)="copyTextToClipboard(row.idCupoTerminal)">
                    <mat-icon>content_copy</mat-icon>
                  </button>
                </td>
              </ng-container>
              <ng-container matColumnDef="idCupoTerminal">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Alfanumérico </th>
                <td mat-cell *matCellDef="let row" data-label="idCupoTerminal"> {{row.idCupoTerminal}} </td>
              </ng-container>
              <ng-container matColumnDef="destino">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Destino </th>
                <td mat-cell *matCellDef="let row" data-label="destino.descripcion "> {{row.destino.descripcion}} </td>
              </ng-container>

              <ng-container matColumnDef="producto">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Producto </th>
                <td mat-cell *matCellDef="let row" data-label="producto"> {{row.producto.descripcion}} </td>
              </ng-container>
              <ng-container matColumnDef="proveedor">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Proveedor </th>
                <td mat-cell *matCellDef="let row" data-label="nombreProveedor"> {{row.nombreProveedor}} </td>
              </ng-container>
              <ng-container matColumnDef="chofer">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Chofer Asignado </th>
                <td mat-cell *matCellDef="let row" data-label="chofer">
                  {{row.nombreChofer}}
                </td>
              </ng-container>
              <ng-container matColumnDef="acciones">
                <th mat-header-cell *matHeaderCellDef>Acciones </th>
                <td mat-cell *matCellDef="let row" data-label="acciones">

                  <div *ngIf="row.nombreChofer">
                    <div [ngSwitch]="row.idCupoEstado">
                      <div *ngSwitchCase="'2'">
                        <button class="btn-rd-15 state-1-button" mat-raised-button>
                          Cargado
                        </button>
                      </div>

                      <div *ngSwitchCase="'3'">
                        <button class="btn-rd-15 state-2-button" mat-raised-button>
                          <mat-icon>download_done</mat-icon>
                          Descargado
                        </button>
                      </div>

                      <div *ngSwitchCase="'4'">
                        <button class="btn-rd-15 state-4-button" mat-raised-button>
                          <mat-icon>block</mat-icon>
                          Rechazado
                        </button>
                      </div>

                      <div *ngSwitchCase="'5'">
                        <button class="btn-rd-15 state-3-button" mat-raised-button>
                          <mat-icon>location_on</mat-icon>
                          En Destino
                        </button>
                      </div>

                      <div *ngSwitchDefault>
                        <button class="btn-rd-15 state-1-button" mat-raised-button (click)="goUpdatePedido(row, 'MODIFICAR')"
                          *ngIf="row.fecha >= yesterday">
                          <mat-icon>edit</mat-icon>
                          Modificar
                        </button>
                      </div>
                    </div>
                  </div>


                  <ng-container *ngIf="!row.nombreChofer">
                    <div [ngSwitch]="row.idCupoEstado">
                      <div *ngSwitchCase="'3'">
                        <button class="btn-rd-15 state-2-button" mat-raised-button>
                          <mat-icon>download_done</mat-icon>
                          Descargado
                        </button>
                      </div>

                      <div *ngSwitchCase="'4'">
                        <button class="btn-rd-15 state-4-button" mat-raised-button>
                          <mat-icon>block</mat-icon>
                          Rechazado
                        </button>
                      </div>

                      <div *ngSwitchCase="'5'">
                        <button class="btn-rd-15 state-3-button" mat-raised-button>
                          <mat-icon>location_on</mat-icon>
                          En Destino
                        </button>
                      </div>

                      <div *ngSwitchDefault>
                        <button class="btn-rd-15 state-default-button" mat-raised-button color="primary"
                          *ngIf="!row.nombreChofer && row.fecha >= yesterday" (click)="pedidoRapido(row, 'ASIGNAR')">
                          <mat-icon>add</mat-icon>
                          Asignar chofer
                        </button>
                      </div>
                    </div>
                  </ng-container>

                </td>
              </ng-container>
              <ng-container matColumnDef="voucher">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Voucher </th>
                <td mat-cell *matCellDef="let row" data-label="voucher">
                  <button mat-icon-button mat-sm-button *ngIf="row.nombreChofer"
                    style="color: #9AB90E; background-color: transparent !important; margin-left: 10px;"
                    matTooltip="Descargar voucher" fxFlexAlign="center center" (click)="descargarVoucher(row)">
                    <mat-icon>cloud_download</mat-icon>
                  </button>
                </td>
              </ng-container>

              <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
              <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="example-element-row">
              </tr>
            </table>
            <mat-paginator #paginator class="mat-paginator-sticky" [pageSizeOptions]="[10]"
              [showFirstLastButtons]="true" (page)="getServerData($event)" [pageSize]="variables.pageEvent.pageSize"
              [length]="variables.pageEvent.length">
            </mat-paginator>
          </div>
        </div>
      </mat-card>
    </div>
  </div>
</div>
