<br>
<div class="m-333">
    <h4 style="color:#124A99;">Flota</h4>
</div>
<mat-card class="p-0">
  <mat-card-content class="p-0">
    <mat-form-field  class="p-5"  style='padding:8px;margin:15px auto;width:30%;'  class = "example-full-width"> 
      <mat-label> <mat-icon matPrefix>search</mat-icon> Buscar por nombre de chofer</mat-label>
      <input  matInput (keyup)='updateFilter($event)'> 
    </mat-form-field>
    <ngx-datatable
          class="material ml-0 mr-0"
          [rows]="choferes"
          [columnMode]="'force'"
          [headerHeight]="50"
          [footerHeight]="50"
          [externalPaging]="false" 
          
          [limit]="10" 
          
          [rowHeight]="'auto'"
          >
          <!-- <ngx-datatable-column name="No." [flexGrow]="1">
            <ng-template let-row="row" ngx-datatable-cell-template>
              {{ row?.id }}
            </ng-template>
          </ngx-datatable-column> -->
          <ngx-datatable-column name="Chofer" [flexGrow]="1">
            <ng-template let-row="row" ngx-datatable-cell-template>
              {{ row?.nombre_persona }}
            </ng-template>
          </ngx-datatable-column>
          <ngx-datatable-column name="Patente de Camión" [flexGrow]="1">
            <ng-template let-row="row" ngx-datatable-cell-template>
              {{ row?.patente }}
            </ng-template>
          </ngx-datatable-column>
          <ngx-datatable-column name="Patente de Acoplado" [flexGrow]="1">
            <ng-template let-row="row" ngx-datatable-cell-template>
              {{ row?.patente_acoplado }}
            </ng-template>
          </ngx-datatable-column>
          <ngx-datatable-column name="Transportista" [flexGrow]="1">
            <ng-template let-row="row" ngx-datatable-cell-template>
              {{ row?.nombre_transportista }}
            </ng-template>
          </ngx-datatable-column>
          <ngx-datatable-column name="Intermediario Vinculado" [flexGrow]="1">
            <ng-template let-row="row" ngx-datatable-cell-template>
              {{ row?.nombre_intermediario }}
            </ng-template>
          </ngx-datatable-column>
          <ngx-datatable-column name="Estado" [flexGrow]="1">
            <ng-template let-row="row" ngx-datatable-cell-template>
              {{ row?.estado }}
            </ng-template>
          </ngx-datatable-column>
          <ngx-datatable-column name="Zona de Chofer" [flexGrow]="1">
            <ng-template let-row="row" ngx-datatable-cell-template>
              {{ row?.nombre_zona }}
            </ng-template>
          </ngx-datatable-column>                
          <ngx-datatable-column name="Registrado en App" [flexGrow]="1">
            <ng-template let-row="row" ngx-datatable-cell-template>
              {{ row?.desc_app }}
            </ng-template>
          </ngx-datatable-column>                
          <ngx-datatable-column name="Acciones" [flexGrow]="1">
            <ng-template let-row="row" ngx-datatable-cell-template>        
              
              <button mat-icon-button mat-sm-button color="primary" class="m-0" matTooltip="Información" (click)="openPopUpInfoPersona(row)" matTooltip="Información Perfil"><mat-icon>account_circle</mat-icon></button>
              
            </ng-template>
          </ngx-datatable-column>
        </ngx-datatable>
  </mat-card-content>
</mat-card>
