<br>
<div class="m-333">
  <h4 style="color:#124A99;">Lista de Pre Pedidos</h4>
</div>
<mat-card class="p-0">
  <mat-card-content class="p-0">

    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
      <!-- fecha_desde Column -->
      <ng-container matColumnDef="fecha_desde">
        <th mat-header-cell *matHeaderCellDef> Desde </th>
        <td mat-cell *matCellDef="let row">{{row?.fecha_desde}} </td>
        <td mat-footer-cell *matFooterCellDef> </td>
      </ng-container>      
      <!-- fecha_hasta Column -->
      <ng-container matColumnDef="fecha_hasta">
        <th mat-header-cell *matHeaderCellDef> Hasta </th>
        <td mat-cell *matCellDef="let row">{{row?.fecha_hasta}} </td>
        <td mat-footer-cell *matFooterCellDef> </td>
      </ng-container>      
      <!-- Remitente Column -->
      <ng-container matColumnDef="remitente">
        <th mat-header-cell *matHeaderCellDef> Remitente </th>
        <td mat-cell *matCellDef="let row">{{row?.remitente}} </td>
        <td mat-footer-cell *matFooterCellDef> </td>
      </ng-container>      
      <!-- tipo_pedido Column -->
      <ng-container matColumnDef="tipo_pedido">
        <th mat-header-cell *matHeaderCellDef> Tipo de Pedido </th>
        <td mat-cell *matCellDef="let row"> {{row?.tipo_pedido}} </td>
        <td mat-footer-cell *matFooterCellDef> </td>
      </ng-container>
      <!-- producto Column -->
      <ng-container matColumnDef="producto">
        <th mat-header-cell *matHeaderCellDef> Producto </th>
        <td mat-cell *matCellDef="let row"> {{row?.producto}} </td>
        <td mat-footer-cell *matFooterCellDef> </td>
      </ng-container>
      <!-- cant_camiones Column -->
      <ng-container matColumnDef="cant_camiones">
        <th mat-header-cell *matHeaderCellDef> Cantidad de camiones </th>
        <td mat-cell *matCellDef="let row"> {{row?.cant_camiones}} </td>
        <td mat-footer-cell *matFooterCellDef> </td>
      </ng-container>
      <!-- lugar_carga Column -->
      <ng-container matColumnDef="lugar_carga">
        <th mat-header-cell *matHeaderCellDef> Lugar de Carga </th>
        <td mat-cell *matCellDef="let row">
          {{ row?.lugar_carga }}
        </td>
        <td mat-footer-cell *matFooterCellDef> </td>
      </ng-container>
      <ng-container matColumnDef="zona_destino">
        <th mat-header-cell *matHeaderCellDef> Zona Destino</th>
        <td mat-cell *matCellDef="let row">
          {{ row?.zona_destino }}
        </td>
        <td mat-footer-cell *matFooterCellDef> </td>
      </ng-container>

      <!-- Acciones Column -->
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef> Acciones </th>
        <td mat-cell *matCellDef="let row">
          <button  mat-icon-button mat-sm-button color="primary" class="mr-1" matTooltip="Pasar a Pedido" (click)="openPopUpSeleccionarPedido(row)">
            <mat-icon>touch_app</mat-icon>
          </button>
        </td>
        <td mat-footer-cell *matFooterCellDef> </td>
      </ng-container> 

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="example-element-row"
        [ngStyle]="(row.disponibilidad=='1' || row?.estado === 'Ocupado') && {'background-color': '#efefef'}"></tr>
      <tr mat-footer-row *matFooterRowDef="displayedColumns"></tr>
    </table>
    <mat-paginator #paginator class="mat-paginator-sticky" [pageSize]="page.size" [pageSizeOptions]="[10]"
      [showFirstLastButtons]="true" [length]="page.totalElements" (page)="setPage($event)">
    </mat-paginator>
  </mat-card-content>
</mat-card>
