<mat-card-title class="">
  <h1 matDialogTitle>{{data.title}}</h1>
  <mat-divider></mat-divider>
</mat-card-title>

<form [formGroup]="itemForm" (ngSubmit)="submit()">
  <div fxLayout="row wrap" fxLayout.lt-sm="column">
    <div fxFlex="50" class="pr-1" hidden>
      <mat-form-field class="full-width">
        <input matInput name="id" [formControl]="itemForm.controls['id']" placeholder="">
      </mat-form-field>
    </div>
    
    <div fxFlex="100" class="pr-1">
      <mat-form-field class="full-width">
        <input matInput maxlength="150" name="mensaje" [formControl]="itemForm.controls['mensaje']" placeholder="Escribir Mensaje">
      </mat-form-field>
      <small *ngIf="itemForm.controls['mensaje'].hasError('required') && itemForm.controls['mensaje'].touched" class="form-error-msg">
        Es requerido el mensaje
      </small>
    </div>
    <mat-divider></mat-divider>
    <div fxFlex="100" class="mt-1">
      <button mat-raised-button color="warn" type="button" (click)="dialogRef.close(false)">Cancelar</button>
      <span fxFlex></span>
      <button mat-raised-button color="primary" [disabled]="itemForm.invalid">Enviar</button>
    </div>
  </div>
</form>
