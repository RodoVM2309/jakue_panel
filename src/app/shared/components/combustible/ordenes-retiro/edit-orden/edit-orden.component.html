<h1 matDialogTitle>{{ data.title }}</h1>
<form [formGroup]="itemForm" (ngSubmit)="submit()">
  <div fxLayout="row wrap" fxLayout.lt-sm="column" [style.overflow]="'auto'" >
    <div fxFlex="100" class="pr-1" hidden>
      <mat-form-field class="full-width">
        <input
          matInput
          name="id"
          [formControl]="itemForm.controls['id']"
          placeholder="Id del producto"
        />
      </mat-form-field>
    </div>    
    <div fxFlex="50" class="pr-1">
        <mat-form-field class="full-width" >  
            <mat-label>Cantidad de Combustible</mat-label>              
          <input
            matInput type="number" class="quantity-input default-bg"
            name="cantidad" [min]="1" [max]="maxValue" name="cantidad"
            [formControl]="itemForm.controls['cantidad']"
            placeholder="cantidad"
            #descripcion
          /> 
          <!-- <mat-hint align="end">{{ razon_social.value.length }} / 50</mat-hint> -->
        </mat-form-field>
        <small
          *ngIf="
            itemForm.controls['cantidad'].hasError('required') &&
            itemForm.controls['cantidad'].touched
          "
          class="form-error-msg"
        >
          La cantidad es obligatorio
        </small>
    </div>
    
   
      <div fxFlex="100" class="mt-1">        
        <button
          mat-raised-button
          color="warn"
          type="button"
          (click)="dialogRef.close(false)"
        >
          Cancelar
        </button>
        <span fxFlex></span>
        <button mat-raised-button color="primary" [disabled]="itemForm.invalid">
          Guardar
        </button>
      </div>
    </div>
</form>
